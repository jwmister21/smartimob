{% extends 'base.html' %}

{% block title %}Editar Imóvel{% endblock %}

{% block pagina %}Editar Imóvel{% endblock %} 

{% block content %}
<style>
    .card { background: #111827; padding: 25px; border-radius: 20px; border: 1px solid #1f2937; }
    
    .form-grid { 
        display: grid; 
        grid-template-columns: repeat(3, 1fr); 
        gap: 15px; 
    }

    .campo-box { display: flex; flex-direction: column; gap: 5px; }
    .campo-box label { color: #9ca3af; font-size: 13px; margin-left: 5px; }

    .form-grid input, .form-grid select {
        width: 100%;
        padding: 12px;
        background: #0f172a;
        border: 1px solid #374151;
        border-radius: 10px;
        color: white;
        box-sizing: border-box;
    }

    .img-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 10px; border: 2px solid #374151; }

    .btn-voltar { color: #9ca3af; text-decoration: none; margin-right: 15px; }
    
    .btn {
        background: #0ea5e9;
        color: white;
        padding: 12px 25px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="campo-box">
                <label>Título</label>
                <input type="text" name="titulo" value="{{ imovel['titulo'] }}" required>
            </div>

            <div class="campo-box">
                <label>Tipo</label>
                <select name="tipo">
                    {% for t in ['Casa', 'Apartamento', 'Terreno', 'Comercial'] %}
                        <option value="{{ t }}" {% if imovel['tipo'] == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="campo-box">
                <label>Valor (R$)</label>
                <input type="text" name="valor" id="valor-input" value="{{ imovel['valor'] }}" placeholder="0,00">
            </div>

            <div class="campo-box">
                <label>Cidade</label>
                <input type="text" name="cidade" value="{{ imovel['cidade'] }}">
            </div>
            <div class="campo-box">
                 <label>Condiminio </label>
                 <input type="text" name="condominio" value="{{ imovel['condominio'] }}">
            </div>

            <div class="campo-box">
                <label>link driver</label>
                <input type="text" name="link" value="{{ imovel['link'] }}">
            </div>
            <div class="campo-box">
                <label>Cep</label>
                <input type="text" name="cep" value="{{ imovel['cep'] }}">
             </div>   
                
            
            <div class="campo-box">
                <label>Bairro</label>
                <input type="text" name="bairro" value="{{ imovel['bairro'] }}">
            </div>

            <div class="campo-box">
                <label>Quartos</label>
                <input type="number" name="quartos" value="{{ imovel['quartos'] or 0 }}">
            </div>

            <div class="campo-box">
                <label>Banheiros</label>
                <input type="number" name="banheiros" value="{{ imovel['banheiros'] or 0 }}">
            </div>

            <div class="campo-box">
                <label>Área (m²)</label>
                <input type="number" name="area" value="{{ imovel['area'] or 0 }}">
            </div>

            <div class="campo-box">
                <label>Status</label>
                <select name="status">
                    <option value="Venda" {% if imovel['status'] == 'Venda' %}selected{% endif %}>Venda</option>
                    <option value="Aluguel" {% if imovel['status'] == 'Aluguel' %}selected{% endif %}>Aluguel</option>
                </select>
            </div>
        </div>

        <div class="campo-box" style="margin-top: 20px;">
            <label>Fotos Atuais:</label>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px;">
        {% for foto in fotos %}
            <div style="position: relative;">
                <img src="/data/uploads/imoveis/{{ foto['nome_arquivo'] }}" class="img-preview">
                <br>
                <a href="/excluir-foto/{{ foto['id'] }}" style="color: #ff4d4d; font-size: 12px;">Excluir</a>
            </div>
        {% endfor %}
    </div>
</div>

        <div class="campo-box" style="margin-top:20px;">
    <label>Adicionar Novas Fotos</label>

    <input
    type="file"
    id="fotos"
    name="fotos[]"
    multiple
    accept="image/*">

         <div id="preview-fotos"
         style="display:flex;flex-wrap:wrap;gap:10px;margin-top:15px;">
    </div>   
  </div>

        

        <label style="color: #9ca3af; font-size: 13px; display: block; margin-top: 15px;">Descrição</label>
        <textarea name="descricao" rows="5" style="width:100%; padding:15px; border-radius:12px; background:#0f172a; border:1px solid #374151; color:white;">{{ imovel['descricao'] }}</textarea>

        <div style="margin-top: 20px;">
            <a href="/imoveis" class="btn-voltar">← Voltar</a>
            <button type="submit" class="btn">Salvar Alterações</button>
        </div>
    </form>
</div>

<script>
document.getElementById("fotos").addEventListener("change", function() {

    let preview = document.getElementById("preview-fotos");

    preview.innerHTML = "";

    Array.from(this.files).forEach(file => {

        let reader = new FileReader();

        reader.onload = function(e) {

            let img = document.createElement("img");

            img.src = e.target.result;

            img.style.width = "120px";
            img.style.height = "120px";
            img.style.objectFit = "cover";
            img.style.borderRadius = "10px";
            img.style.border = "2px solid #374151";

            preview.appendChild(img);
        };

        reader.readAsDataURL(file);
    });

});


 
const inputValor = document.getElementById('valor-input');

inputValor.addEventListener('input', (e) => {
    let valor = e.target.value.replace(/\D/g, ''); // Remove tudo que não é número
    
    if (valor === "") {
        e.target.value = "";
        return;
    }

    // Formata o número para moeda brasileira
    valor = (Number(valor) / 100).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });

    e.target.value = valor;
});

    document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById('valor-input');
    if (input.value) {
        let valor = input.value.replace(/\D/g, '');
        input.value = (Number(valor) / 100).toLocaleString('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        });
    }
});
</script>
{% endblock %}
