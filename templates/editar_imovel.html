{% extends 'base.html' %}

{% block title %}Editar Imóvel{% endblock %}
{% block pagina %}Editar Imóvel{% endblock %} 

{% block content %}
<style>
    /* Design Premium Moderno */
    .card-edit { 
        background: #ffffff; 
        padding: 40px; 
        border-radius: 20px; 
        border: 1px solid #e2e8f0; 
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        color: #1e293b;
        max-width: 900px;
        margin: auto;
    }

    .section-title { 
        color: #2563eb; 
        margin: 30px 0 20px 0; 
        font-size: 1.1em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .section-title::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; }

    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .campo-box { display: flex; flex-direction: column; gap: 8px; }
    .campo-box label { color: #64748b; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    
    input, select, textarea { 
        width: 100%; padding: 12px; background: #f8fafc; 
        border: 1px solid #e2e8f0; border-radius: 10px; 
        font-size: 14px; transition: 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #2563eb; outline: none; background: #fff; }

    .img-preview { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; border: 2px solid #edf2f7; }
    
    .btn-container { margin-top: 30px; display: flex; align-items: center; gap: 20px; }
    .btn { background: #2563eb; color: white; padding: 12px 30px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #1d4ed8; }
    .btn-voltar { color: #64748b; text-decoration: none; font-weight: 500; }
</style>

<div class="card-edit">
    <form method="POST" enctype="multipart/form-data">
        
        <h3 class="section-title">Informações Principais</h3>
        <div class="form-grid">
            <div class="campo-box" style="grid-column: span 1;"><label>Título</label><input type="text" name="titulo" value="{{ imovel['titulo'] }}" required></div>
            <div class="campo-box"><label>Tipo</label>
                <select name="tipo">
                    {% for t in ['Casa', 'Apartamento', 'Terreno', 'Comercial', 'Duplex', 'Triplex', 'Kitnet', 'Bangalo'] %}
                        <option value="{{ t }}" {% if imovel['tipo'] == t %}selected{% endif %}>{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="campo-box"><label>Status</label>
                <select name="status">
                    <option value="Venda" {% if imovel['status'] == 'Venda' %}selected{% endif %}>Venda</option>
                    <option value="Aluguel" {% if imovel['status'] == 'Aluguel' %}selected{% endif %}>Aluguel</option>
                </select>
            </div>
        </div>

        <h3 class="section-title">Localização</h3>
        <div class="form-grid">
            <div class="campo-box"><label>CEP</label><input type="text" name="cep" value="{{ imovel['cep'] }}"></div>
            <div class="campo-box"><label>Cidade</label><input type="text" name="cidade" value="{{ imovel['cidade'] }}"></div>
            <div class="campo-box"><label>Bairro</label><input type="text" name="bairro" value="{{ imovel['bairro'] }}"></div>
            <div class="campo-box" style="grid-column: span 3;"><label>Rua / Logradouro</label><input type="text" name="rua" value="{{ imovel['rua'] }}"></div>
        </div>

        <h3 class="section-title">Detalhes do Imóvel</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Área (m²)</label><input type="number" name="area" value="{{ imovel['area'] or 0 }}"></div>
            <div class="campo-box"><label>Quartos</label><input type="number" name="quartos" value="{{ imovel['quartos'] or 0 }}"></div>
            <div class="campo-box"><label>Suítes</label><input type="number" name="banheiros" value="{{ imovel['banheiros'] or 0 }}"></div>
            <div class="campo-box"><label>Banheiros</label><input type="number" name="banheiros21" value="{{ imovel['banheiros21'] or 0 }}"></div>
            <div class="campo-box"><label>Vagas</label><input type="number" name="vaga_garagem" value="{{ imovel['vaga_garagem'] or 0 }}"></div>
            <div class="campo-box"><label>Lavabo</label>
                <select name="lavabo"><option value="0" {% if not imovel['lavabo'] %}selected{% endif %}>Não</option><option value="1" {% if imovel['lavabo'] %}selected{% endif %}>Sim</option></select>
            </div>
            <div class="campo-box"><label>Sacada</label>
                <select name="sacada"><option value="0" {% if not imovel['sacada'] %}selected{% endif %}>Não</option><option value="1" {% if imovel['sacada'] %}selected{% endif %}>Sim</option></select>
            </div>
            <div class="campo-box" style="grid-column: span 3;"><label>Área de Lazer</label><input type="text" name="lazer" value="{{ imovel['lazer'] or '' }}"></div>
        </div>

        <h3 class="section-title">Financeiro</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Valor (R$)</label><input type="text" name="valor" class="moeda" value="{{ imovel['valor'] }}"></div>
            <div class="campo-box"><label>Condomínio (R$)</label><input type="text" name="condominio" class="moeda" value="{{ imovel['condominio'] }}"></div>
            <div class="campo-box"><label>IPTU (R$)</label><input type="text" name="iptu" class="moeda" value="{{ imovel['iptu'] }}"></div>
            <div class="campo-box"><label>Entrada</label><input type="text" name="entrada" class="moeda" value="{{ imovel['entrada'] }}"></div>
            <div class="campo-box"><label>Parcela</label><input type="text" name="parcela" class="moeda" value="{{ imovel['parcela'] }}"></div>
            <div class="campo-box"><label>Anuais</label><input type="text" name="anuais" class="moeda" value="{{ imovel['anuais'] }}"></div>
            <div class="campo-box" style="grid-column: span 3;"><label>Prazo</label><input type="text" name="prazo" value="{{ imovel['prazo'] }}"></div>
            <div class="campo-box" style="grid-column: span 3;"><label>Link Drive</label><input type="text" name="link" value="{{ imovel['link'] }}"></div>
        </div>

        <h3 class="section-title">Fotos</h3>
        <div class="campo-box">
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                {% for foto in fotos %}
                    <div style="text-align: center;">
                        <img src="/data/uploads/imoveis/{{ foto['nome_arquivo'] }}" class="img-preview">
                        <br><a href="/excluir-foto/{{ foto['id'] }}" style="color: #ef4444; font-size: 11px;">Excluir</a>
                    </div>
                {% endfor %}
            </div>
            <input type="file" name="fotos[]" multiple accept="image/*" id="input-fotos" style="margin-top:15px">
            <div id="preview-fotos" style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;"></div>
        </div>

        <div class="campo-box" style="margin-top: 20px;"><label>Descrição</label><textarea name="descricao" rows="5">{{ imovel['descricao'] }}</textarea></div>

        <div class="btn-container">
            <a href="/imoveis" class="btn-voltar">← Voltar</a>
            <button type="submit" class="btn">Salvar Alterações</button>
        </div>
    </form>
</div>

<script>
// Preview de fotos
document.getElementById("input-fotos").addEventListener("change", function() {
    let preview = document.getElementById("preview-fotos");
    preview.innerHTML = "";
    Array.from(this.files).forEach(file => {
        let reader = new FileReader();
        reader.onload = (e) => {
            let img = document.createElement("img");
            img.src = e.target.result;
            img.className = "img-preview";
            preview.appendChild(img);
        };
        reader.readAsDataURL(file);
    });
});

// Formatação Moeda (Evita erro se o valor for nulo no banco)
function formatarMoeda(v) {
    v = v.replace(/\D/g, '');
    return (Number(v) / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

document.querySelectorAll('.moeda').forEach(input => {
    input.addEventListener('input', (e) => e.target.value = formatarMoeda(e.target.value));
    if(input.value) input.value = formatarMoeda(input.value);
});
</script>
{% endblock %}
