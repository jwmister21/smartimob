{% extends 'base.html' %}

{% block content %}
<style>

h2, h3{
    color:#1e293b;
    margin-bottom:20px;
}

label{
    color:#64748b;
    font-weight:600;
    font-size:0.9rem;
}

.config-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(450px,1fr));
    gap:25px;
    margin-bottom:25px;
}

.config-box{
    background:#ffffff;
    padding:30px;
    border-radius:20px;
    border:1px solid #e2e8f0;
    box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);
}

.form-control{
    width:100%;
    padding:12px;
    margin:8px 0 20px 0;
    border:1px solid #e2e8f0;
    border-radius:12px;
    background:#f8fafc;
    color:#1e293b;
}

.btn-salvar{
    background:#2563eb;
    color:white;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    transition:0.2s;
}

.btn-salvar:hover{
    background:#1d4ed8;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #f1f5f9;
    margin-bottom:20px;
}

.logo-imobiliaria{
    width:220px;
    max-height:120px;
    object-fit:contain;
    background:#fff;
    border:1px solid #e2e8f0;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
}

</style>

<h2>Configurações</h2>

<div class="config-grid">

    <!-- PERFIL -->
    <div class="config-box">

        <h3>Meu Perfil</h3>

        <form action="/configuracoes" method="POST" enctype="multipart/form-data">

            {% if usuario[1] %}
                <img
                    src="{{ url_for('static', filename=usuario[1]) }}"
                    class="avatar"
                >
            {% endif %}

            <label>Alterar foto:</label>
            <input
                type="file"
                name="foto"
                class="form-control"
                accept="image/*"
            >

            <label>Nome:</label>
            <input
                type="text"
                name="nome"
                class="form-control"
                value="{{ usuario[0] }}"
            >

            <button type="submit" class="btn-salvar">
                Salvar Perfil
            </button>

        </form>

    </div>

    <!-- LOGO IMOBILIÁRIA -->
    {% if usuario[2] == 1 %}

<div class="config-box">

    <h3>Logo da Imobiliária</h3>

    <form
        action="/salvar_logo_imobiliaria"
        method="POST"
        enctype="multipart/form-data"
    >

        {% if empresa and empresa["logo"] %}
            <img
                src="{{ empresa['logo'] }}"
                class="logo-imobiliaria"
            >
        {% endif %}

        <label>Enviar logo:</label>

        <input
            type="file"
            name="logo"
            class="form-control"
            accept="image/*"
        >

        <button type="submit" class="btn-salvar">
            Salvar Logo
        </button>

    </form>

</div>

{% endif %}
</div>

<!-- SEGURANÇA -->
<div class="config-box">

    <h3>Segurança</h3>

    <form action="/atualizar_senha" method="POST">

        <label>Senha Atual:</label>
        <input
            type="password"
            name="senha_atual"
            class="form-control"
            required
        >

        <label>Nova Senha:</label>
        <input
            type="password"
            name="nova_senha"
            class="form-control"
            required
        >

        <button type="submit" class="btn-salvar">
            Alterar Senha
        </button>

    </form>

</div>

{% endblock %}
