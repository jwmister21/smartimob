<form method="POST" action="/gerar_site/salvar">

    <h2>Gerar Site da Imobiliária</h2>

    <label>Nome do site</label>
    <input name="nome" required>

    <label>Slug (URL)</label>
    <input name="slug" placeholder="minha-imobiliaria" required>

    <label>Cor do tema</label>
    <input type="color" name="cor" value="#22c55e">

    <button type="submit">
        🚀 Gerar Site
    </button>

</form>
