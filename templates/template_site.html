<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ empresa.nome_imobiliaria }}</title>
    <style>
        :root { --cor-principal: {{ empresa.cor_primaria }}; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; }
        header { background: #fff; padding: 20px; text-align: center; border-bottom: 3px solid var(--cor-principal); }
        .logo { max-width: 150px; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        .imoveis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 15px; }
        .preco { color: var(--cor-principal); font-size: 1.5rem; font-weight: bold; }
        
        footer { background: #333; color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        {% if empresa.logo_url %}
            <img src="{{ empresa.logo_url }}" class="logo" alt="Logo">
        {% else %}
            <h1>{{ empresa.nome_imobiliaria }}</h1>
        {% endif %}
    </header>

    <div class="container">
        <div class="imoveis-grid">
            {% for i in imoveis %}
                <div class="card">
                    <img src="/uploads/imoveis/{{ foto }}" alt="Foto do imóvel">
                    <div class="card-body">
                        <h3>{{ i.titulo }}</h3>
                        <p>🏠 {{ i.quartos }} Quartos | 📐 {{ i.area }} m²</p>
                        <p class="preco">R$ {{ imovel.valor }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <footer>
        <p>&copy; 2026 {{ empresa.nome_imobiliaria }} - Desenvolvido com SMARTZEN IMOB</p>
    </footer>
</body>
</html>
