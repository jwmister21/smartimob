<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ empresa.nome }}</title>

    <style>
        :root {
            --cor: #22c55e;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--cor);
        }

        header h1 {
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .preco {
            color: var(--cor);
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background: var(--cor);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>{{ empresa.nome }}</h1>
</header>

<div class="container">

    <div class="grid">

        {% for i in imoveis %}
        <div class="card">

            <img src="{{ i.foto }}" alt="Imóvel">

            <div class="card-body">

                <h3>{{ i.titulo }}</h3>

                <p>🏠 {{ i.quartos }} quartos</p>
                <p>📍 {{ i.cidade }}</p>

                <p class="preco">
                    R$ {{ i.valor }}
                </p>

                <a class="btn" href="/imovel/{{ i.id }}">
                    Ver detalhes
                </a>

            </div>

        </div>
        {% endfor %}

    </div>

</div>

<footer>
    © {{ empresa.nome }} - Todos os direitos reservados
</footer>

</body>
</html>
