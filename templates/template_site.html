<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>{{ empresa.nome }}</title>

<style>
:root {
    --cor: #22c55e;
    --bg: #0f172a;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f3f4f6;
}

/* HEADER */
header {
    background: white;
    padding: 25px;
    text-align: center;
    border-bottom: 4px solid var(--cor);
}

header h1 {
    margin: 0;
    font-size: 26px;
}

/* FILTROS */
.filtros {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    padding: 15px;
    background: white;
    margin: 20px auto;
    max-width: 1100px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.filtros input, .filtros select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    outline: none;
    flex: 1;
}

/* CONTAINER */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 10px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* BADGE */
.badge {
    position: absolute;
    background: var(--cor);
    color: white;
    padding: 5px 10px;
    font-size: 12px;
    border-radius: 20px;
    margin: 10px;
}

/* BODY */
.card-body {
    padding: 15px;
}

.titulo {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 8px;
}

.info {
    font-size: 13px;
    color: #555;
    margin-bottom: 5px;
}

.preco {
    color: var(--cor);
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

.btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 12px;
    background: var(--cor);
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 13px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    background: #111827;
    color: white;
}
</style>
</head>

<body>

<header>
    <h1>🏢 {{ empresa.nome }}</h1>
</header>

<!-- FILTROS -->
<div class="container">
<form class="filtros" method="GET">

    <input type="text" name="cidade" placeholder="Cidade">

    <input type="number" name="quartos" placeholder="Quartos">

    <input type="text" name="preco" placeholder="Preço máximo">

    <button type="submit" class="btn">Filtrar</button>

</form>
</div>

<!-- IMÓVEIS -->
<div class="container">
<div class="grid">

    {% for i in imoveis %}

    <div class="card">

        <div style="position:relative;">
            <span class="badge">{{ i.cidade }}</span>
            <img src="{{ i.foto }}" alt="Imóvel">
        </div>

        <div class="card-body">

            <div class="titulo">{{ i.titulo }}</div>

            <div class="info">🏠 {{ i.quartos }} quartos</div>
            <div class="info">📍 {{ i.bairro }}</div>

            <div class="preco">R$ {{ i.valor }}</div>

            <a class="btn" href="/imovel/{{ i.id }}">
                Ver detalhes
            </a>

        </div>

    </div>

    {% endfor %}

</div>
</div>

<footer>
    © {{ empresa.nome }} - Todos os direitos reservados
</footer>

</body>
</html>
