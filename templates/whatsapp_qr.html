<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>SMARTZEN WhatsApp</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
}

.card {
    background: #111827;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    width: 420px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h2 {
    margin-bottom: 10px;
}

.status {
    margin-bottom: 15px;
    font-size: 14px;
    color: #38bdf8;
}

select {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: none;
}

.qr-box {
    background: white;
    padding: 15px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 20px;
}

.qr-box img {
    width: 250px;
    height: 250px;
}

button {
    background: #22c55e;
    border: none;
    padding: 10px 20px;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin: 5px;
    width: 100%;
}

button:hover {
    background: #16a34a;
}

.red {
    background: #ef4444;
}

.red:hover {
    background: #dc2626;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h2>SMARTZEN WhatsApp</h2>

        <!-- SELEÇÃO DE SESSÃO -->
        <select id="sessaoSelect" onchange="trocarSessao()">
            <option value="empresa_1">Empresa 1</option>
            <option value="empresa_2">Empresa 2</option>
            <option value="empresa_3">Empresa 3</option>
        </select>

        <div id="status" class="status">
            Aguardando conexão...
        </div>

        <div class="qr-box">
            <img id="qr" src="" />
        </div>

        <button onclick="conectar()">Gerar QR</button>
        <button class="red" onclick="desconectar()">Desconectar</button>

    </div>

</div>

<script>

const NODE_API = "https://lucky-analysis-production-e497.up.railway.app";

let sessao = document.getElementById("sessaoSelect").value;

// ======================
// TROCAR SESSÃO
// ======================
function trocarSessao() {

    sessao = document.getElementById("sessaoSelect").value;

    document.getElementById("qr").src = "";
    document.getElementById("status").innerText = "Sessão alterada";

    monitorar();
}

// ======================
// CONECTAR
// ======================
async function conectar() {

    await fetch(`${NODE_API}/api/whatsapp/conectar`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ sessao })
    });

    monitorar();
}

// ======================
// PEGAR QR
// ======================
async function buscarQR() {

    const res = await fetch(`${NODE_API}/api/whatsapp/qr/${sessao}`);
    const data = await res.json();

    if (data.qr) {
        document.getElementById("qr").src = data.qr;
    }
}

// ======================
// MONITORAMENTO EM TEMPO REAL
// ======================
function monitorar() {

    setInterval(async () => {

        const res = await fetch(`${NODE_API}/api/whatsapp/status/${sessao}`);
        const data = await res.json();

        document.getElementById("status").innerText = data.status;

        if (data.status === "conectado") {
            document.getElementById("qr").style.display = "none";
        } else {
            document.getElementById("qr").style.display = "block";
            buscarQR();
        }

    }, 2000);
}

// ======================
// DESCONEXÃO (futuro)
// ======================
function desconectar() {
    alert("Vamos implementar logout na próxima etapa");
}

// inicia monitoramento automático
monitorar();

</script>

</body>
</html>
