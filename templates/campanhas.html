{% extends 'base.html' %}
{% block title %}Envio WhatsApp{% endblock %}

{% block content %}

<style>
.container-box {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    border: 1px solid #ddd;
}

textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    margin-top: 10px;
    width: 100%;
    padding: 12px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #1e40af;
}

.cliente {
    display: flex;
    gap: 10px;
    padding: 10px;
    border-bottom: 1px solid #eee;
}

.status {
    margin-top: 10px;
    font-weight: bold;
    color: green;
}
</style>

<div class="container-box">

<!-- ================= ESQUERDA ================= -->
<div class="card">
    <h2>📤 Disparo WhatsApp</h2>

    <textarea id="telefones" placeholder="Lista gerada automaticamente"></textarea>

    <textarea id="mensagem" placeholder="Mensagem (use {name})"></textarea>

    <input id="delay" type="number" value="3" placeholder="Delay (segundos)">

    <button onclick="enviar()">🚀 ENVIAR AGORA</button>

    <div class="status" id="status"></div>
</div>

<!-- ================= DIREITA ================= -->
<div class="card">
    <h2>👥 Clientes</h2>

    <textarea id="importar" placeholder="Nome,Telefone
JOAO,551199999999
MARIA,551188888888"></textarea>

    <button onclick="importar()">📥 Importar</button>
    <button onclick="selecionarTodos()">☑ Selecionar todos</button>

    <div id="lista"></div>
</div>

</div>

<script>

let selecionados = [];

/* =========================
   SESSÃO
========================= */
function salvarSessao(session) {
    localStorage.setItem("smartzen_session", session);
}

function getSessao() {
    return localStorage.getItem("smartzen_session");
}

/* =========================
   IMPORTAR
========================= */
function importar() {

    let texto = document.getElementById("importar").value;

    let linhas = texto.split("\n");

    linhas.forEach(l => {
        let [name, phone] = l.split(",");

        if (!name || !phone) return;

        phone = phone.replace(/\D/g, "");
        if (!phone.startsWith("55")) phone = "55" + phone;

        if (!selecionados.find(c => c.phone === phone)) {
            selecionados.push({ name, phone });
        }
    });

    render();
}

/* =========================
   RENDER LISTA
========================= */
function render() {

    let div = document.getElementById("lista");
    div.innerHTML = "";

    selecionados.forEach((c, i) => {

        div.innerHTML += `
        <div class="cliente">
            <input type="checkbox" checked onchange="remover(${i})">
            <div>
                <b>${c.name}</b><br>
                ${c.phone}
            </div>
        </div>`;
    });

    document.getElementById("telefones").value =
        selecionados.map(c => `${c.name},${c.phone}`).join("\n");
}

/* =========================
   REMOVER
========================= */
function remover(i) {
    selecionados.splice(i, 1);
    render();
}

/* =========================
   SELECIONAR TODOS
========================= */
function selecionarTodos() {
    document.querySelectorAll("#lista input").forEach(e => e.checked = true);
}

/* =========================
   TEMPLATE
========================= */
function montar(msg, c) {
    return msg
        .replaceAll("{name}", c.name)
        .replaceAll("{phone}", c.phone);
}

/* =========================
   ENVIO
========================= */
async function enviar() {

    let session = getSessao();

    if (!session) {
        alert("Nenhuma sessão ativa!");
        return;
    }

    let msg = document.getElementById("mensagem").value;
    let delay = parseInt(document.getElementById("delay").value) || 3;

    for (let i = 0; i < selecionados.length; i++) {

        let c = selecionados[i];

        document.getElementById("status").innerText =
            `Enviando ${i+1}/${selecionados.length} → ${c.name}`;

        await fetch("/whatsapp/enviar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                session: session,
                numero: c.phone,
                mensagem: montar(msg, c)
            })
        });

        await new Promise(r => setTimeout(r, delay * 1000));
    }

    document.getElementById("status").innerText = "✅ Finalizado";
}

</script>

{% endblock %}
