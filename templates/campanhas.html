{% extends 'base.html' %}

{% block title %}Sessões WhatsApp{% endblock %}
{% block pagina %}Sessões WhatsApp{% endblock %}

{% block content %}
<style>
    .box-sessoes {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 22px;
        padding: 25px;
        box-shadow: 0 10px 25px rgba(15,23,42,.08);
    }

    .topo-sessoes {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .topo-sessoes h2 {
        margin: 0;
        color: #0f172a;
    }

    .btn-criar {
        border: none;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        color: white;
        padding: 13px 18px;
        border-radius: 14px;
        font-weight: 800;
        cursor: pointer;
    }

    .card-sessao {
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 18px;
        background: #f8fafc;
    }
</style>

<div class="box-sessoes">
    <div class="topo-sessoes">
        <h2>Multi-sessões WhatsApp</h2>

        <form method="POST" action="/whatsapp/criar-sessao">
            <button class="btn-criar" type="submit">+ Criar minha sessão</button>
        </form>
    </div>

    <div class="card-sessao">
        <strong>Instância:</strong> usuario_1<br>
        <strong>Status:</strong> aguardando conexão<br><br>
        Depois vamos mostrar o QR Code aqui.
    </div>
</div>
{% endblock %}
