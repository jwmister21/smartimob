{% extends 'base.html' %}

{% block title %}
Envio WhatsApp
{% endblock %}


{% block content %}


<style>

/* ===============================
   SMARTZEN WHATSAPP PAGE
================================*/


.whatsapp-page{

    width:100%;
    padding:25px;

}



/* CABEÇALHO */

.whatsapp-header{

    background:white;
    border-radius:20px;
    padding:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;

    border:1px solid #e5e7eb;

}


.whatsapp-header h1{

    margin:0;

    font-size:28px;

    color:#111827;

}


.whatsapp-header span{

    color:#64748b;

}




/* GRID */


.whatsapp-grid{

    display:grid;

    grid-template-columns: 1fr 1fr;

    gap:25px;

}




/* CARDS */


.whatsapp-card{

    background:white;

    border-radius:22px;

    padding:25px;

    border:1px solid #e5e7eb;

    box-shadow:0 8px 25px rgba(0,0,0,.05);

}



.whatsapp-card h2{

    margin-top:0;

    color:#111827;

    font-size:20px;

}



/* INPUTS */


.whatsapp-input,
.whatsapp-textarea{

    width:100%;

    padding:14px;

    border-radius:14px;

    border:1px solid #d1d5db;

    margin-top:12px;

    font-size:14px;

    outline:none;

}



.whatsapp-textarea{

    min-height:120px;

    resize:none;

}



/* BOTÕES */


.whatsapp-btn{

    width:100%;

    margin-top:15px;

    padding:14px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;

    font-size:15px;

}



.btn-enviar{

    background:#2563eb;

    color:white;

}


.btn-importar{

    background:#16a34a;

    color:white;

}


.btn-todos{

    background:#f59e0b;

    color:white;

}





/* CLIENTES */


.clientes-top{

    display:flex;

    gap:10px;

    margin-bottom:15px;

}



.clientes-info{

    background:#f1f5f9;

    padding:12px;

    border-radius:12px;

    font-weight:600;

}



.lista-clientes{

    max-height:520px;

    overflow-y:auto;

}




.cliente-item{

    display:flex;

    align-items:center;

    gap:15px;

    padding:15px;

    border-radius:15px;

    margin-bottom:10px;

    background:#f8fafc;

    border:1px solid #e5e7eb;

}



.cliente-item:hover{

    background:#eff6ff;

}



.cliente-avatar{

    width:40px;

    height:40px;

    border-radius:50%;

    background:#2563eb;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    font-weight:bold;

}




.status-envio{

    margin-top:20px;

    padding:15px;

    border-radius:15px;

    background:#ecfdf5;

    color:#166534;

    font-weight:bold;

}




@media(max-width:900px){


.whatsapp-grid{

    grid-template-columns:1fr;

}


.whatsapp-header{

    flex-direction:column;

    gap:10px;

}


}


</style>





<div class="whatsapp-page">



<div class="whatsapp-header">

<div>

<h1>
📲 Disparo WhatsApp
</h1>

<span>
Envie mensagens personalizadas para seus clientes
</span>

</div>


<div>

🚀 SMARTZEN CRM

</div>


</div>





<div class="whatsapp-grid">





<!-- =============================
     ENVIO
============================== -->


<div class="whatsapp-card">


<h2>
📤 Configurar envio
</h2>



<textarea 
id="telefones"
class="whatsapp-textarea"
placeholder="Lista gerada automaticamente">
</textarea>




<textarea
id="mensagem"
class="whatsapp-textarea"
placeholder="Mensagem use {name} para nome e {phone} para telefone">
</textarea>




<input

id="delay"

class="whatsapp-input"

type="number"

value="3"

placeholder="Delay segundos">




<button

class="whatsapp-btn btn-enviar"

onclick="enviar()">

🚀 ENVIAR AGORA

</button>




<div 
id="status"
class="status-envio">

Aguardando envio...

</div>



</div>








<!-- =============================
     CLIENTES
============================== -->


<div class="whatsapp-card">


<h2>
👥 Clientes
</h2>




<textarea

id="importar"

class="whatsapp-textarea"

placeholder="Nome,Telefone

JOAO,551199999999

MARIA,551188888888">

</textarea>





<button

class="whatsapp-btn btn-importar"

onclick="importar()">

📥 Importar lista

</button>




<button

class="whatsapp-btn btn-todos"

onclick="selecionarTodos()">

☑ Selecionar todos

</button>





<div class="clientes-info">

Clientes selecionados:

<span id="contador">
0
</span>

</div>





<div 
id="lista"

class="lista-clientes">

</div>



</div>



</div>


</div>





<script>


let selecionados=[];



/* SESSÃO */


function salvarSessao(session){

localStorage.setItem(
"smartzen_session",
session
);

}


function getSessao(){

return localStorage.getItem(
"smartzen_session"
);

}





/* IMPORTAR */


function importar(){


let texto =
document.getElementById("importar").value;


let linhas =
texto.split("\n");



linhas.forEach(l=>{


let dados=l.split(",");


let name=dados[0];

let phone=dados[1];



if(!name || !phone)
return;



phone =
phone.replace(/\D/g,"");



if(!phone.startsWith("55"))
phone="55"+phone;




if(!selecionados.find(c=>c.phone===phone)){


selecionados.push({

name:name,

phone:phone

});


}


});



render();


}






/* RENDER */


function render(){


let lista =
document.getElementById("lista");


lista.innerHTML="";



selecionados.forEach((c,i)=>{


lista.innerHTML += `


<div class="cliente-item">


<input

type="checkbox"

checked

onchange="remover(${i})">



<div class="cliente-avatar">

${c.name.charAt(0)}

</div>



<div>

<b>${c.name}</b>

<br>

<small>${c.phone}</small>


</div>


</div>



`;


});




document.getElementById("contador").innerText =
selecionados.length;



document.getElementById("telefones").value =

selecionados
.map(c=>`${c.name},${c.phone}`)
.join("\n");



}





function remover(i){

selecionados.splice(i,1);

render();

}





function selecionarTodos(){


document
.querySelectorAll("#lista input")
.forEach(e=>{

e.checked=true;

});


}







function montar(msg,c){


return msg

.replaceAll("{name}",c.name)

.replaceAll("{phone}",c.phone);


}








async function enviar(){



let session=getSessao();



if(!session){

alert(
"Nenhuma sessão WhatsApp conectada"
);

return;

}




let msg =
document.getElementById("mensagem").value;



let delay =
parseInt(
document.getElementById("delay").value
)||3;




for(let i=0;i<selecionados.length;i++){



let c=selecionados[i];



document.getElementById("status").innerHTML =

`Enviando ${i+1}/${selecionados.length} → ${c.name}`;





await fetch("/whatsapp/enviar",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

session:session,

numero:c.phone,

mensagem:montar(msg,c)

})


});




await new Promise(r=>

setTimeout(r,delay*1000)

);



}




document.getElementById("status").innerHTML=

"✅ Envio finalizado";



}



</script>



{% endblock %}
