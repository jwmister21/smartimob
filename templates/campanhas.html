{% extends 'base.html' %}

{% block title %}Campanhas WhatsApp{% endblock %}

{% block content %}
<style>
/* ===== SEU CSS ORIGINAL (mantido) ===== */

.campanha-area {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.card {
    background: #ffffff;
    border-radius: 20px;
    padding: 25px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
}

h2 { margin-top: 0; color: #1e293b; font-size: 1.5rem; }

label {
    color: #64748b;
    display: block;
    margin-top: 15px;
    font-weight: 600;
    font-size: 0.9rem;
}

input, textarea {
    width: 100%;
    box-sizing: border-box;
    background: #f8fafc;
    color: #1e293b;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px;
    margin-top: 8px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: 0;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.lista {
    height: 520px;
    overflow-y: auto;
    margin-top: 15px;
}

.cliente {
    background: #fff;
    padding: 18px;
    margin-bottom: 12px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 20px;
    border: 1px solid #e2e8f0;
}

.nome-cliente {
    font-weight: 800;
    color: #1e293b;
}

.detalhe-cliente {
    font-size: 0.85rem;
    color: #64748b;
}

.checkCliente {
    width: 20px;
    height: 20px;
    accent-color: #2563eb;
}

.btn-selecionar {
    background: #1e293b !important;
}

.contador {
    margin-top: 10px;
    font-weight: 600;
    color: #64748b;
}

#status {
    margin-top: 10px;
    color: #059669;
    font-weight: bold;
}

@media(max-width:900px){
    .campanha-area { grid-template-columns: 1fr; }
}
</style>

<div class="campanha-area">

<!-- ================= LEFT ================= -->
<div class="card">
    <h2>📢 Disparo WhatsApp</h2>

    <label>📱 Telefones selecionados</label>
    <textarea id="telefones" rows="6" placeholder="Selecione ou importe contatos"></textarea>

    <label>💬 Mensagem (use {name})</label>
    <textarea id="mensagem" rows="6" placeholder="Ex: Olá {name}, tudo bem?"></textarea>

    <label>⏱ Delay entre mensagens (segundos)</label>
    <input id="delay" type="number" value="3">

    <button onclick="iniciarEnvio()">🚀 Enviar Mensagens</button>

    <div class="contador">
        Clientes selecionados: <span id="qtd">0</span>
    </div>

    <div id="status"></div>
</div>

<!-- ================= RIGHT ================= -->
<div class="card">
    <h2>👥 Clientes</h2>

    <label>🔍 Importar lista (Nome,Telefone)</label>
    <textarea id="importarLista" rows="6"
    placeholder="JACKSON,551199999999&#10;MARIA,551188888888"></textarea>

    <button onclick="importarPlanilha()">📥 Importar</button>

    <button class="btn-selecionar" onclick="selecionarTodos()">
        ☑ Selecionar Visíveis
    </button>

    <div class="lista">
        {% for c in clientes %}
        <div class="cliente">
            <input type="checkbox"
                   class="checkCliente"
                   data-tel="{{c.telefone}}"
                   onchange="selecionarCliente(this)">

            <div>
                <div class="nome-cliente">{{c.nome}}</div>
                <div class="detalhe-cliente">{{c.telefone}}</div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

</div>

<script>

let selecionados = [];

/* =========================
   CONTADOR
========================= */
function atualizarContador(){
    document.getElementById("qtd").innerText = selecionados.length;
}

/* =========================
   TEXTAREA AUTO
========================= */
function atualizarTextarea(){
    document.getElementById("telefones").value =
        selecionados.map(c => `${c.name},${c.phone}`).join("\n");
}

/* =========================
   SELEÇÃO
========================= */
function selecionarCliente(check){

    const card = check.closest(".cliente");

    let name = card.querySelector(".nome-cliente").innerText.trim();
    let phone = check.dataset.tel.replace(/\D/g,'');

    if(!phone.startsWith("55")) phone = "55"+phone;

    if(check.checked){
        if(!selecionados.find(c => c.phone === phone)){
            selecionados.push({name, phone});
        }
    } else {
        selecionados = selecionados.filter(c => c.phone !== phone);
    }

    atualizarTextarea();
    atualizarContador();
}

/* =========================
   SELECIONAR VISÍVEIS
========================= */
function selecionarTodos(){
    document.querySelectorAll(".checkCliente").forEach(chk=>{
        if(!chk.checked){
            chk.checked = true;
            selecionarCliente(chk);
        }
    });
}

/* =========================
   IMPORTAÇÃO JACKSON,NUMERO
========================= */
function importarPlanilha(){

    let texto = document.getElementById("importarLista").value;

    let linhas = texto.split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

    let novos = 0;

    linhas.forEach(linha=>{

        let partes = linha.split(",");

        let name = (partes[0] || "").trim();
        let phone = (partes[1] || "").replace(/\D/g,"").trim();

        if(!name || !phone) return;

        if(!phone.startsWith("55")) phone = "55"+phone;

        if(!selecionados.find(c => c.phone === phone)){
            selecionados.push({name, phone});
            novos++;
        }
    });

    atualizarTextarea();
    atualizarContador();

    alert("Importados: " + novos);
}

/* =========================
   TEMPLATE {name}
========================= */
function montarMensagem(template, cliente){
    return template
        .replaceAll("{name}", cliente.name || "cliente")
        .replaceAll("{phone}", cliente.phone || "");
}

/* =========================
   ENVIO COM DELAY
========================= */
async function iniciarEnvio(){

    let mensagem = document.getElementById("mensagem").value;
    let delay = parseInt(document.getElementById("delay").value);

    if(!mensagem){
        alert("Digite uma mensagem");
        return;
    }

    if(!delay || delay < 1) delay = 3;

    for(let i=0;i<selecionados.length;i++){

        let cliente = selecionados[i];
        let msgFinal = montarMensagem(mensagem, cliente);

        document.getElementById("status").innerText =
            `📤 Enviando ${i+1}/${selecionados.length} → ${cliente.name}`;

        try{

            const resp = await fetch("/whatsapp/enviar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    numero: cliente.phone,
                    mensagem: msgFinal
                })
            });

            const data = await resp.json();

            if(!data.success){
                console.log("Erro envio:", data);
            }

        }catch(e){
            console.log("Erro fetch:", e);
        }

        await new Promise(r => setTimeout(r, delay * 1000));
    }

    document.getElementById("status").innerText = "✅ Finalizado";
}
</script>

{% endblock %}
