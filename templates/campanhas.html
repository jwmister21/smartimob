{% extends 'base.html' %}

{% block title %}Campanhas WhatsApp{% endblock %}

{% block content %}
<style>
    /* Reset e ajuste para o padrão Clean */
    .campanha-area {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    h2 { margin-top: 0; color: #1e293b; font-size: 1.5rem; }
    
    label { color: #64748b; display: block; margin-top: 15px; font-weight: 500; }

    input, textarea {
        width: 100%; box-sizing: border-box;
        background: #f8fafc; color: #1e293b;
        border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 12px; margin-top: 8px; outline: none;
    }

    button {
        width: 100%; padding: 14px; margin-top: 18px; border: 0;
        border-radius: 12px; background: #2563eb; color: white;
        font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; transform: translateY(-2px); }

    .lista { height: 520px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }

    .cliente {
        background: #f8fafc; padding: 14px; margin-bottom: 10px;
        border-radius: 12px; display: flex; align-items: center; gap: 12px;
        border: 1px solid #e2e8f0;
    }
    .cliente:hover { background: #f1f5f9; }

    .valor { color: #059669; font-weight: bold; }
    .contador { margin-top: 15px; color: #64748b; font-weight: 600; }
    #status { margin-top: 10px; color: #059669; font-weight: bold; }

    @media(max-width:900px) { .campanha-area { grid-template-columns: 1fr; } }
</style>

<div class="campanha-area">
    <!-- DISPARO -->
    <div class="card">
        <h2>📢 Disparo WhatsApp</h2>
        <label>📱 Telefones selecionados</label>
        <textarea id="telefones" rows="8" placeholder="Selecione clientes ao lado"></textarea>

        <label>💬 Mensagem</label>
        <textarea id="mensagem" rows="7" placeholder="Digite a mensagem"></textarea>

        <label>⏱ Intervalo entre envios (segundos)</label>
        <input id="delay" type="number" value="5">

        <button onclick="iniciarEnvio()">🚀 Iniciar campanha</button>

        <div class="contador">Clientes selecionados: <span id="qtd">0</span></div>
        <div id="status"></div>
    </div>

    <!-- CLIENTES -->
    <div class="card">
        <h2>👥 Clientes</h2>
        <input id="filtroValor" placeholder="Filtrar por orçamento máximo (Ex: 300.000)" oninput="formatarFiltro(); filtrarClientes()">
        <button onclick="selecionarTodos()" style="background: #64748b;">☑ Selecionar todos visíveis</button>

        <div class="lista">
            {% for c in clientes %}
            <div class="cliente" data-orcamento="{{c.faixa_preco}}">
                <input type="checkbox" class="checkCliente" data-tel="{{c.telefone}}" onchange="selecionarCliente(this)">
                <div class="info">
                    <b>{{c.nome}}</b><br>
                    📱 {{c.telefone}}<br>
                    💰 <span class="valor">{{ c.faixa_preco }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    // Mantendo sua lógica original intacta
    function atualizarContador(){
        let qtd = document.querySelectorAll(".checkCliente:checked").length;
        document.getElementById("qtd").innerHTML = qtd;
    }

    function selecionarCliente(check){
        let tel = check.dataset.tel.replace(/\D/g,'');
        if(!tel.startsWith("55")) tel = "55" + tel;
        let campo = document.getElementById("telefones");
        let lista = campo.value.split("\n").filter(x=>x);
        if(check.checked){ if(!lista.includes(tel)) lista.push(tel); }
        else{ lista = lista.filter(x=>x != tel); }
        campo.value = lista.join("\n");
        atualizarContador();
    }

    function selecionarTodos(){
        document.querySelectorAll(".cliente").forEach(card=>{
            if(card.style.display != "none"){
                let check = card.querySelector(".checkCliente");
                check.checked = true;
                selecionarCliente(check);
            }
        });
    }

    function limparValor(valor){
        if(!valor) return 0;
        valor = valor.replace("R$","").replace(/\./g,"").replace(",",".").trim();
        return parseFloat(valor) || 0;
    }

    function filtrarClientes(){
        let campo = document.getElementById("filtroValor").value;
        let limite = limparValor(campo);
        if(!limite) limite = 999999999;
        document.querySelectorAll(".cliente").forEach(card=>{
            let preco = limparValor(card.dataset.orcamento);
            card.style.display = (preco <= limite) ? "flex" : "none";
        });
    }

    async function iniciarEnvio(){
        let telefones = document.getElementById("telefones").value.split("\n").filter(x=>x);
        let mensagem = document.getElementById("mensagem").value;
        let delay = parseInt(document.getElementById("delay").value);
        let status = document.getElementById("status");

        for(let i=0; i<telefones.length; i++){
            let telefone = telefones[i];
            status.innerHTML = "Enviando para: " + telefone;
            await fetch("/enviar_mensagem", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ telefone, mensagem })
            });
            await new Promise(r => setTimeout(r, delay * 1000));
        }
        status.innerHTML = "✅ Campanha finalizada";
    }

    function formatarFiltro(){
        let campo = document.getElementById("filtroValor");
        let valor = campo.value.replace(/\D/g,'');
        if(valor) campo.value = parseInt(valor).toLocaleString('pt-BR');
    }
</script>
{% endblock %}
