{% extends 'base.html' %}

{% block title %}Campanhas WhatsApp{% endblock %}

{% block content %}
<style>
    /* Estilos Gerais */
    .campanha-area {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 25px;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    h2 { margin-top: 0; color: #1e293b; font-size: 1.5rem; }
    label { color: #64748b; display: block; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }

    input, textarea {
        width: 100%; box-sizing: border-box;
        background: #f8fafc; color: #1e293b;
        border: 1px solid #e2e8f0; border-radius: 12px;
        padding: 12px; margin-top: 8px; outline: none;
    }

    button {
        width: 100%; padding: 14px; margin-top: 18px; border: 0;
        border-radius: 12px; background: #2563eb; color: white;
        font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: #1d4ed8; transform: translateY(-2px); }

    /* Estilos da Lista de Clientes (O design "mais fino") */
    .lista { height: 520px; overflow-y: auto; margin-top: 15px; padding-right: 5px; }

    .cliente {
        background: #ffffff;
        padding: 18px;
        margin-bottom: 12px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        gap: 20px;
        border: 1px solid #e2e8f0;
        transition: all 0.3s ease;
    }
    .cliente:hover { border-color: #94a3b8; transform: translateX(5px); }

    .checkCliente { width: 20px; height: 20px; cursor: pointer; accent-color: #2563eb; }

    .info { flex: 1; display: flex; flex-direction: column; gap: 4px; }

    .nome-cliente {
        font-weight: 800;
        font-size: 0.95rem;
        color: #1e293b;
        text-transform: uppercase;
        letter-spacing: 1.2px; /* Nome esticado */
    }

    .detalhe-cliente { font-size: 0.85rem; color: #64748b; }
    .valor { color: #059669; font-weight: 700; }
    
    .btn-selecionar { background: #1e293b !important; font-size: 0.9rem; letter-spacing: 0.5px; }

    .contador { margin-top: 15px; color: #64748b; font-weight: 600; }
    #status { margin-top: 10px; color: #059669; font-weight: bold; }

    @media(max-width:900px) { .campanha-area { grid-template-columns: 1fr; } }
</style>

<div class="campanha-area">
    <!-- COLUNA DISPARO -->
    <div class="card">
        <h2>📢 Disparo WhatsApp</h2>
        <label>📱 Telefones selecionados</label>
        <textarea id="telefones" rows="8" placeholder="Selecione clientes ao lado"></textarea>

        <label>💬 Mensagem</label>
        <textarea id="mensagem" rows="7" placeholder="Digite a mensagem"></textarea>

        <label>⏱ Intervalo entre envios (segundos)</label>
        <input id="delay" type="number" value="5">


   <button type="button" onclick="iniciarEnvio()">
    Enviar Mensagem
</button>

        <div class="contador">Clientes selecionados: <span id="qtd">0</span></div>
        <div id="status"></div>
    </div>

    <!-- COLUNA CLIENTES -->
    <div class="card">
        <h2>👥 Clientes</h2>
        <input id="filtroValor" placeholder="🔍 Filtrar orçamento máximo (Ex: 300.000)" 
               oninput="formatarFiltro(); filtrarClientes()">

        <button class="btn-selecionar" onclick="selecionarTodos()">☑ SELECIONAR VISÍVEIS</button>

       <label>📋 Importar lista (Nome,Telefone)</label>
<textarea id="importarLista" rows="5"
placeholder="Ex:
JOAO SILVA,551199999999
MARIA SOUZA,551188888888"></textarea>

<button onclick="importarPlanilha()">📥 Importar lista</button>
        
        <div class="lista">
            {% for c in clientes %}
            <div class="cliente" data-orcamento="{{c.faixa_preco}}">
                <input type="checkbox" class="checkCliente" data-tel="{{c.telefone}}" onchange="selecionarCliente(this)">
                <div class="info">
                    <span class="nome-cliente">{{c.nome}}</span>
                    <span class="detalhe-cliente">📱 {{c.telefone}}</span>
                    <span class="detalhe-cliente">💰 <span class="valor">{{ c.faixa_preco }}</span></span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
  
let selecionados = [];

// =========================
// UTIL
// =========================
function atualizarContador() {
    document.getElementById("qtd").innerText = selecionados.length;
}

function atualizarTextarea() {
    const campo = document.getElementById("telefones");

    campo.value = selecionados
        .map(c => `${c.name},${c.phone}`)
        .join("\n");
}

// =========================
// SELEÇÃO INDIVIDUAL
// =========================
function selecionarCliente(check) {

    const card = check.closest(".cliente");

    let name = card.querySelector(".nome-cliente").innerText.trim();
    let phone = check.dataset.tel.replace(/\D/g, '');

    if (!phone.startsWith("55")) {
        phone = "55" + phone;
    }

    if (check.checked) {

        if (!selecionados.find(c => c.phone === phone)) {
            selecionados.push({ name, phone });
        }

    } else {
        selecionados = selecionados.filter(c => c.phone !== phone);
    }

    atualizarTextarea();
    atualizarContador();
}

// =========================
// SELEÇÃO VISÍVEL
// =========================
function selecionarTodos() {

    document.querySelectorAll(".cliente").forEach(card => {

        if (card.style.display !== "none") {

            const check = card.querySelector(".checkCliente");

            if (!check.checked) {
                check.checked = true;
                selecionarCliente(check);
            }
        }
    });
}

// =========================
// FILTRO
// =========================
function limparValor(valor) {
    if (!valor) return 0;
    return parseFloat(valor.replace(/\D/g, "")) || 0;
}

function filtrarClientes() {

    let campo = document.getElementById("filtroValor").value;
    let limite = limparValor(campo);

    if (!limite) limite = 999999999;

    document.querySelectorAll(".cliente").forEach(card => {

        let preco = limparValor(card.dataset.orcamento);

        card.style.display = (preco <= limite) ? "flex" : "none";
    });
}

function formatarFiltro() {

    let campo = document.getElementById("filtroValor");
    let valor = campo.value.replace(/\D/g, '');

    if (valor) {
        campo.value = parseInt(valor).toLocaleString('pt-BR');
    }
}

// =========================
// IMPORTAÇÃO
// =========================
function importarPlanilha() {

    let texto = document.getElementById("importarLista").value;

    let linhas = texto
        .split(/\r?\n/)
        .map(l => l.trim())
        .filter(l => l.length > 0);

    console.log("📌 LINHAS ENCONTRADAS:", linhas);

    let novos = 0;

    linhas.forEach(linha => {

        let partes = linha.split(",");

        let name = (partes[0] || "").trim();
        let phone = (partes[1] || "").replace(/\D/g, '').trim();

        if (!phone) return;

        if (!phone.startsWith("55")) {
            phone = "55" + phone;
        }

        let existe = selecionados.find(c => c.phone === phone);

        if (!existe) {
            selecionados.push({ name, phone });
            novos++;
        }
    });

    console.log("📌 TOTAL SELECIONADOS:", selecionados);

    atualizarTextarea();
    atualizarContador();

    alert(`Importação concluída: ${novos} novos contatos`);
}
// =========================
// TEMPLATE
// =========================
function montarMensagem(template, cliente) {

    return template
        .replaceAll("{name}", cliente.name || "")
        .replaceAll("{phone}", cliente.phone || "");
}

// =========================
// ENVIO WHATSAPP (NODE)
// =========================
async function iniciarEnvio() {

    let mensagem = document.getElementById("mensagem").value;
    let delay = parseInt(document.getElementById("delay").value);
    let statusEl = document.getElementById("status");

    if (!delay || delay < 1) delay = 1;

    for (let i = 0; i < selecionados.length; i++) {

        let cliente = selecionados[i];

        let msgFinal = montarMensagem(mensagem, cliente);

        statusEl.innerHTML = `📤 Enviando ${i + 1}/${selecionados.length} → ${cliente.name}`;

        try {

            const resp = await fetch("https://zoom-leggings-viability.ngrok-free.dev/enviar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    sessao: "empresa_1",
                    numero: cliente.phone,
                    mensagem: msgFinal
                })
            });

            const data = await resp.json();
            console.log("ENVIO OK:", cliente.name, data);

        } catch (err) {
            console.log("Erro envio:", err);
        }

        await new Promise(r => setTimeout(r, delay * 1000));
    }

    statusEl.innerHTML = "✅ Campanha finalizada";
}
</script>
{% endblock %}
