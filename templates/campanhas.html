{% extends 'base.html' %}

{% block title %}Campanhas WhatsApp{% endblock %}

{% block content %}


<style>

body{
    font-family:Arial;
    background:#0f172a;
    color:white;
}


.card{
    max-width:900px;
    margin:auto;
    background:#111827;
    padding:25px;
    border-radius:15px;
}


input,textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#020617;
    color:white;
    border:1px solid #334155;
    border-radius:10px;
}


.clientes{
    margin-top:20px;
    background:#020617;
    padding:15px;
    border-radius:12px;
    max-height:300px;
    overflow:auto;
}


.cliente{
    display:flex;
    justify-content:space-between;
    padding:12px;
    border-bottom:1px solid #1e293b;
}


button{

    margin-top:20px;
    width:100%;
    padding:14px;
    background:#22c55e;
    border:0;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;

}


.valor{
    color:#38bdf8;
}


</style>



<div class="card">


<h2>📢 Campanha WhatsApp</h2>


<label>🔎 Filtrar orçamento até:</label>

<input 
type="number" 
id="filtroValor"
placeholder="Ex: 300000"
onkeyup="filtrarClientes()">



<div class="clientes" id="listaClientes">


{% for c in clientes %}

<div 
class="cliente"
data-orcamento="{{c.orcamento or 0}}"
>


<div>


<input 
type="checkbox"
class="checkCliente"
data-tel="{{c.telefone}}"
onchange="selecionarCliente(this)"
>


<b>{{c.nome}}</b>

<br>

📱 {{c.telefone}}

<br>

💰 
<span class="valor">
R$ {{ "{:,.2f}".format(c.orcamento or 0) }}
</span>


</div>


</div>


{% endfor %}


</div>



<label>📱 Telefones</label>

<textarea 
id="telefones"
rows="8"
placeholder="Clientes selecionados aparecerão aqui">
</textarea>



<label>💬 Mensagem</label>

<textarea 
id="mensagem"
rows="5">
</textarea>



<label>⏱ Intervalo segundos</label>

<input 
id="delay"
type="number"
value="5">



<button onclick="iniciarEnvio()">
🚀 Enviar campanha
</button>



<div id="status"></div>


</div>




<script>


function selecionarCliente(check){


let tel = check.dataset.tel;

let campo = document.getElementById("telefones");


let numeros = campo.value
.split("\n")
.filter(x=>x);



if(check.checked){

    if(!numeros.includes(tel)){
        numeros.push(tel);
    }

}else{

    numeros =
    numeros.filter(n=>n != tel);

}



campo.value = numeros.join("\n");


}




function filtrarClientes(){


let valor =
parseFloat(
document.getElementById("filtroValor").value
)
|| 999999999;



document.querySelectorAll(".cliente")
.forEach(card=>{


let preco =
parseFloat(card.dataset.orcamento);



if(preco <= valor){

    card.style.display="flex";

}else{

    card.style.display="none";

}



});

}



async function iniciarEnvio(){


let telefones =
document.getElementById("telefones")
.value
.split("\n")
.filter(x=>x);


let mensagem =
document.getElementById("mensagem").value;


let delay =
parseInt(
document.getElementById("delay").value
);



let status =
document.getElementById("status");



for(let i=0;i<telefones.length;i++){


let telefone=telefones[i];


status.innerHTML=
"Enviando "+telefone;



await fetch("/enviar_mensagem",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

telefone,
mensagem

})


});



await new Promise(
r=>setTimeout(r,delay*1000)
);



}



status.innerHTML=
"✅ Campanha finalizada";


}



</script>



{% endblock %}
