{% extends 'base.html' %}

{% block title %}Campanhas WhatsApp{% endblock %}

{% block content %}
<style>
body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #111827, #0f172a);
    margin: 0;
    padding: 30px;
    color: #e5e7eb;
}

/* CARD PRINCIPAL */
.card {
    max-width: 780px;
    margin: auto;
    background: rgba(17, 24, 39, 0.92);
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);
}

/* TÍTULO */
h2 {
    margin-bottom: 22px;
    font-size: 24px;
    color: #60a5fa;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* LABELS */
label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-size: 13px;
    color: #9ca3af;
}

/* INPUTS */
textarea, input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #0b1220;
    color: #e5e7eb;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
    box-sizing: border-box;
}

textarea:focus, input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}

/* BOTÃO */
button {
    margin-top: 22px;
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(37,99,235,0.25);
}

/* STATUS */
#status {
    margin-top: 18px;
    font-size: 14px;
    padding: 10px;
    border-radius: 10px;
    background: #0b1220;
    border: 1px solid #1f2937;
    color: #9ca3af;
}

/* STATUS VARIAÇÕES (JS pode usar depois se quiser) */
.status-ok { color: #22c55e; }
.status-error { color: #ef4444; }
.status-loading { color: #fbbf24; }

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .card {
        padding: 18px;
    }

    h2 {
        font-size: 20px;
    }
}
</style>

<div class="card">

    <h2>📢 Nova Campanha WhatsApp</h2>

    <label>📱 Telefones (um por linha)</label>
    <textarea id="telefones" rows="8"
        placeholder="5511999999999&#10;5511888888888"></textarea>

    <label>💬 Mensagem</label>
    <textarea id="mensagem" rows="6"
        placeholder="Olá! Temos novos imóveis disponíveis..."></textarea>

    <label>⏱️ Intervalo entre envios (segundos)</label>
    <input type="number" id="delay" value="5" min="1">

    <button onclick="iniciarEnvio()">🚀 Iniciar campanha</button>

    <div id="status"></div>

</div>

<script>
async function iniciarEnvio() {

    const telefones = document.getElementById("telefones")
        .value.split("\n")
        .map(t => t.trim())
        .filter(t => t);

    const mensagem = document.getElementById("mensagem").value;
    const delay = parseInt(document.getElementById("delay").value);

    const status = document.getElementById("status");

    if (telefones.length === 0 || !mensagem) {
        status.innerHTML = "⚠️ Preencha telefones e mensagem!";
        return;
    }

    for (let i = 0; i < telefones.length; i++) {

        const telefone = telefones[i];

        status.innerHTML =
            `⏳ Enviando ${i+1}/${telefones.length} → ${telefone}`;

        try {
            const resp = await fetch("/enviar_mensagem", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    telefone,
                    mensagem
                })
            });

            const data = await resp.json();

            if (data.status !== "ok") {
                console.log("❌ Erro ao enviar:", telefone, data);
                status.innerHTML =
                    `❌ Erro ao enviar ${telefone}`;
            }

        } catch (err) {
            console.log("Erro request:", err);
            status.innerHTML =
                `❌ Falha na requisição: ${telefone}`;
        }

        await new Promise(r => setTimeout(r, delay * 1000));
    }

    status.innerHTML = "✅ Campanha finalizada!";
}
</script>

{% endblock %}
