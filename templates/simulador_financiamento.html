{% extends 'base.html' %}

{% block title %}Simulador de Financiamento{% endblock %}

{% block content %}
<style>
.simulador-container{
    max-width: 900px;
    margin: auto;
    background: #0f172a;
    padding: 25px;
    border-radius: 12px;
    color: white;
    margin-top: 20px;
}

.simulador-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.simulador-container input,
.simulador-container select{
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
}

.simulador-btn{
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.simulador-btn:hover{
    background: #1d4ed8;
}

.resultado{
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #22c55e;
}
</style>
<div class="simulador-container">

    <h2>🏠 Simulador de Financiamento</h2>

    <div class="simulador-grid">

        <input type="number" id="valor" placeholder="Valor do imóvel">

        <input type="number" id="entrada" placeholder="Entrada">

        <select id="banco" onchange="setTaxa()">
            <option value="caixa">Caixa</option>
            <option value="itau">Itaú</option>
            <option value="bradesco">Bradesco</option>
            <option value="santander">Santander</option>
        </select>

        <input type="number" id="taxa" placeholder="Taxa (%)" readonly>

        <input type="number" id="prazo" placeholder="Prazo (meses)">
    </div>

    <button class="simulador-btn" onclick="simular()">
        Simular financiamento
    </button>

    <div id="resultado" class="resultado"></div>

</div>
<script>

function setTaxa() {

    let banco = document.getElementById("banco").value;

    let taxas = {
        caixa: 0.85,
        itau: 0.95,
        bradesco: 1.05,
        santander: 1.10
    };

    document.getElementById("taxa").value = taxas[banco];
}

function simular() {

    let valor = parseFloat(document.getElementById("valor").value);
    let entrada = parseFloat(document.getElementById("entrada").value);
    let taxa = parseFloat(document.getElementById("taxa").value) / 100;
    let prazo = parseInt(document.getElementById("prazo").value);

    if (!valor || !entrada || !taxa || !prazo) {
        document.getElementById("resultado").innerHTML =
            "Preencha todos os campos!";
        return;
    }

    let pv = valor - entrada;
    let i = taxa;

    let parcela = (pv * i) / (1 - Math.pow(1 + i, -prazo));

    document.getElementById("resultado").innerHTML =
        "💰 Parcela estimada: R$ " + parcela.toFixed(2);
}

</script>
{% endblock %}
