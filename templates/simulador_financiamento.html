{% extends 'base.html' %}

{% block title %}Simulador de Financiamento{% endblock %}

{% block content %}

<style>
.simulador-container{
    max-width: 900px;
    margin: auto;
    background: #0f172a;
    padding: 25px;
    border-radius: 12px;
    color: white;
    margin-top: 20px;
}

.simulador-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.simulador-container input,
.simulador-container select{
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    width: 100%;
}

.simulador-btn{
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.simulador-btn:hover{
    background: #1d4ed8;
}

.resultado{
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #22c55e;
}
</style>

<div class="simulador-container">

    <h2>🏠 Simulador de Financiamento</h2>

    <div class="simulador-grid">

        <input type="text" id="valor" placeholder="Valor do imóvel">

        <input type="text" id="entrada" placeholder="Entrada">

        <select id="banco" onchange="setTaxa()">
            <option value="caixa">Caixa</option>
            <option value="itau">Itaú</option>
            <option value="bradesco">Bradesco</option>
            <option value="santander">Santander</option>
        </select>

        <input type="number" id="taxa" placeholder="Taxa (%)" readonly>

        <select id="prazo">
            <option value="12">12 meses</option>
            <option value="24">24 meses</option>
            <option value="36">36 meses</option>
            <option value="60">60 meses</option>
            <option value="120">120 meses</option>
            <option value="240">240 meses</option>
            <option value="360">360 meses</option>
            <option value="420">420 meses</option>
        </select>

    </div>

    <button class="simulador-btn" onclick="simular()">
        Simular financiamento
    </button>

    <div id="resultado" class="resultado"></div>

</div>

<script>

// taxas por banco
function setTaxa() {

    let banco = document.getElementById("banco").value;

    let taxas = {
        caixa: 0.85,
        itau: 0.95,
        bradesco: 1.05,
        santander: 1.10
    };

    document.getElementById("taxa").value = taxas[banco];
}


// formatar R$ enquanto digita
function formatBRL(value){
    value = value.replace(/\D/g, "");
    value = (value/100).toFixed(2) + "";
    value = value.replace(".", ",");
    value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    return "R$ " + value;
}


// converter R$ para número
function parseBRL(value){
    return parseFloat(
        value.replace("R$","")
             .replace(/\./g,"")
             .replace(",",".")
             .trim()
    );
}


// máscara inputs
document.getElementById("valor").addEventListener("input", function(e){
    e.target.value = formatBRL(e.target.value);
});

document.getElementById("entrada").addEventListener("input", function(e){
    e.target.value = formatBRL(e.target.value);
});


// simulação
function simular() {

    let valor = parseBRL(document.getElementById("valor").value);
    let entrada = parseBRL(document.getElementById("entrada").value);
    let taxa = parseFloat(document.getElementById("taxa").value) / 100;
    let prazo = parseInt(document.getElementById("prazo").value);

    if (!valor || !entrada || !taxa || !prazo) {
        document.getElementById("resultado").innerHTML =
            "⚠️ Preencha todos os campos corretamente";
        return;
    }

    let pv = valor - entrada;
    let i = taxa;

    let parcela = (pv * i) / (1 - Math.pow(1 + i, -prazo));

    document.getElementById("resultado").innerHTML =
        "💰 Parcela estimada: R$ " + parcela.toFixed(2);
}

</script>

{% endblock %}
