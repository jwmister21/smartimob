
{% extends "base.html" %}
{% block content %}

<style>

:root{
    --primary:#2563eb;
    --primary-hover:#1d4ed8;
    --success:#16a34a;
    --danger:#ef4444;

    --bg:#f4f7fb;
    --card:#ffffff;

    --title:#111827;
    --text:#374151;
    --muted:#6b7280;

    --border:#e5e7eb;
}


body{
    background:var(--bg);
}


.campanha-container{

    max-width:1450px;
    margin:auto;
    padding:30px;

}


/* CARD PRINCIPAL */

.smart-card{

    background:white;
    border:1px solid var(--border);
    border-radius:24px;
    padding:25px;
    margin-bottom:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.05);

}


.titulo-card{

    display:flex;
    align-items:center;
    gap:12px;

    margin-bottom:20px;

}


.titulo-card i{

    font-size:25px;
    color:var(--primary);

}


.titulo-card h4{

    margin:0;
    font-weight:700;

}


/* GRID */

.grid{

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;

}


@media(max-width:900px){

.grid{
    grid-template-columns:1fr;
}

}



/* INPUTS */


.form-control{

    min-height:52px;

    border-radius:16px;

    border:1px solid #dbe3ef;

    background:#fbfdff;

}


textarea.form-control{

    min-height:220px;

}



.form-control:focus{

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(37,99,235,.12);

}



/* BOTÕES */


.btn{

    border-radius:15px;

    padding:12px 20px;

    font-weight:600;

}


.btn-primary{

    background:var(--primary);

    border-color:var(--primary);

}



.btn-primary:hover{

    background:var(--primary-hover);

}




/* LISTA CLIENTES */


.lista-clientes{

    max-height:450px;

    overflow-y:auto;

    background:#f8fafc;

    padding:12px;

    border-radius:20px;

    border:1px solid var(--border);

}



.cliente{

    display:flex;

    align-items:center;

    gap:15px;

    padding:15px;

    margin-bottom:10px;

    background:white;

    border-radius:18px;

    border:1px solid #e5e7eb;

    cursor:pointer;

}



.cliente:hover{

    border-color:var(--primary);

}



.cliente input{

    width:20px;
    height:20px;

}



.cliente-info{

    flex:1;

}


.cliente-info strong{

    display:block;

    color:var(--title);

}



.cliente-info small{

    color:var(--muted);

}




.badge{

    background:#eef2ff;

    color:#2563eb;

    padding:7px 12px;

    border-radius:20px;

    font-weight:700;

}



/* RESULTADO */


.resultado{

    min-height:300px;

    background:#0f172a;

    color:#d1fae5;

    font-family:monospace;

}



.estatisticas{

    display:flex;

    gap:15px;

    flex-wrap:wrap;

    margin-top:20px;

}



.stat{

    background:#f8fafc;

    border-radius:18px;

    padding:15px 25px;

    border:1px solid var(--border);

}



.stat strong{

    display:block;

    color:var(--primary);

    font-size:25px;

}



.stat span{

    color:var(--muted);

}


</style>



<div class="campanha-container">


<div class="mb-4">

<h2>

<i class="bi bi-people-fill text-primary"></i>

Gerador de Base de Clientes

</h2>


<p class="text-muted">

Monte listas de contatos para campanhas do WhatsApp.

</p>


</div>




<!-- INSERÇÃO MANUAL -->

<div class="smart-card">


<div class="titulo-card">

<i class="bi bi-pencil-square"></i>

<h4>Adicionar contatos manualmente</h4>


</div>



<div class="grid">


<div>

<label>Nomes</label>

<textarea

id="nomes"

class="form-control"

placeholder="João Silva&#10;Maria Santos">

</textarea>


</div>



<div>

<label>Telefones</label>

<textarea

id="telefones"

class="form-control"

placeholder="5511999999999">

</textarea>


</div>


</div>



<div class="mt-4">


<button

class="btn btn-primary"

id="gerarManual">

<i class="bi bi-magic"></i>

Gerar Lista

<button

class="btn btn-success"

id="copiar">

class="btn btn-danger"

Limpar

</div>



</div>





<div class="grid">



<!-- CLIENTES -->

<div class="smart-card">


<div class="titulo-card">

<i class="bi bi-database"></i>

<h4>Clientes cadastrados</h4>

</div>


<input

id="filtro"

class="form-control mb-3"

placeholder="Filtrar cliente...">

<input

type="checkbox"

class="cliente-check"

{{ cliente.nome }}
</strong>

</div>

<div class="smart-card">


<div class="titulo-card">

</div>



<textarea

id="resultado"

readonly

class="form-control resultado"

placeholder="Nome,telefone">

</textarea>




<div class="estatisticas">

<span>Manual</span>

</div>

</div>



</div>



</div>



</div>

<script>

let contatosManuais = [];
let contatosSelecionados = [];



// LIMPA TELEFONE

function limparTelefone(numero){

    return String(numero)
    .replace(/\D/g,"");

}



// MONTA LINHA

function montarLinha(nome, telefone){

    return `${nome},${limparTelefone(telefone)}`;

}



// GERAR CONTATOS MANUAIS

document
.getElementById("gerarManual")
.addEventListener("click",function(){



    let nomes =
    document
    .getElementById("nomes")
    .value
    .split("\n")
    .map(x=>x.trim())
    .filter(x=>x);



    let telefones =
    document
    .getElementById("telefones")
    .value
    .split("\n")
    .map(x=>limparTelefone(x))
    .filter(x=>x);



    contatosManuais=[];



    let total =
    Math.min(
        nomes.length,
        telefones.length
    );



    for(let i=0;i<total;i++){


        contatosManuais.push({

            nome:nome = nomes[i],

            telefone:telefones[i]

        });


    }



    atualizarResultado();


});





// CLIENTES SELECIONADOS


document
.querySelectorAll(".cliente-check")
.forEach(check=>{


check.addEventListener("change",function(){


    contatosSelecionados=[];



    document
    .querySelectorAll(".cliente-check:checked")
    .forEach(item=>{


        contatosSelecionados.push({

            nome:item.dataset.nome,

            telefone:
            limparTelefone(
                item.dataset.telefone
            )


        });


    });



    atualizarResultado();



});


});





// FILTRO DE CLIENTES


document
.getElementById("filtro")
.addEventListener("input",function(){


let busca =
this.value.toLowerCase();



document
.querySelectorAll(".cliente")
.forEach(cliente=>{


let texto =
cliente.innerText.toLowerCase();



if(texto.includes(busca)){


    cliente.style.display="flex";


}else{


    cliente.style.display="none";


}


});


});






// ATUALIZA RESULTADO


function atualizarResultado(){


let todos=[

    ...contatosManuais,

    ...contatosSelecionados

];



let usados = new Set();


let lista=[];



todos.forEach(contato=>{


let telefone =
limparTelefone(
    contato.telefone
);



if(!usados.has(telefone)){


    usados.add(telefone);



    lista.push({

        nome:contato.nome,

        telefone:telefone

    });


}



});





document
.getElementById("resultado")
.value =

lista
.map(c=>
montarLinha(
    c.nome,
    c.telefone
)
)
.join("\n");





document
.getElementById("totalManual")
.innerText =
contatosManuais.length;




document
.getElementById("totalSelecionados")
.innerText =
contatosSelecionados.length;




document
.getElementById("total")
.innerText =
lista.length;



}







// COPIAR


document
.getElementById("copiar")
.addEventListener("click",function(){


let texto =
document
.getElementById("resultado")
.value;



if(!texto){


alert(
"Não existe nenhum contato gerado."
);


return;


}



navigator
.clipboard
.writeText(texto);



alert(
"Lista copiada com sucesso!"
);



});







// LIMPAR


document
.getElementById("limpar")
.addEventListener("click",function(){



document
.getElementById("nomes")
.value="";



document
.getElementById("telefones")
.value="";



document
.getElementById("resultado")
.value="";



document
.querySelectorAll(".cliente-check")
.forEach(c=>{


c.checked=false;


});



contatosManuais=[];

contatosSelecionados=[];



atualizarResultado();



});



</script>


{% endblock %}
