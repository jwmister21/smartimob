{% extends "base.html" %}

{% block content %}
<div class="container mt-5">

  <div class="card shadow-lg p-4">

    <h2 class="text-center mb-4">📲 Conexão WhatsApp SmartZen</h2>

    <div class="text-center">

      <div id="status" class="mb-3">
        🔴 Desconectado
      </div>

      <!-- QR CODE -->
      <div id="qr-box" class="mb-4">
        <img id="qr-img" src="" style="width: 250px; display:none;" />
      </div>

      <button class="btn btn-success" onclick="startSession()">
        Iniciar Sessão
      </button>

      <button class="btn btn-danger" onclick="logoutSession()">
        Desconectar
      </button>

      <hr>

      <h5>Enviar mensagem teste</h5>

      <input id="phone" class="form-control mb-2" placeholder="5511999999999">
      <input id="message" class="form-control mb-2" placeholder="Mensagem">

      <button class="btn btn-primary" onclick="sendMessage()">
        Enviar
      </button>

    </div>
  </div>
</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api/smartzen1";
const TOKEN = "THISISMYSECURETOKEN";

// iniciar sessão e pegar QR
async function startSession() {
  const res = await fetch(`${API}/start-session`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TOKEN,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ waitQrCode: true })
  });

  const data = await res.json();
  console.log(data);

  loadQR();
}

// buscar QR
async function loadQR() {
  const res = await fetch(`${API}/qrcode-session`, {
    headers: {
      "Authorization": "Bearer " + TOKEN
    }
  });

  const blob = await res.blob();
  const url = URL.createObjectURL(blob);

  document.getElementById("qr-img").src = url;
  document.getElementById("qr-img").style.display = "block";

  document.getElementById("status").innerHTML = "🟡 Aguardando QR...";
}

// enviar mensagem
async function sendMessage() {
  const phone = document.getElementById("phone").value;
  const message = document.getElementById("message").value;

  const res = await fetch(`${API}/send-message`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TOKEN,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ phone, message })
  });

  const data = await res.json();
  console.log(data);

  alert("Mensagem enviada!");
}

// logout
async function logoutSession() {
  await fetch(`${API}/logout-session`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TOKEN
    }
  });

  document.getElementById("status").innerHTML = "🔴 Desconectado";
  document.getElementById("qr-img").style.display = "none";
}

</script>

{% endblock %}
