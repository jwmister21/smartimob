{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>📲 WhatsApp Multi-Sessão SmartZen</h2>

<!-- CRIAR SESSÃO -->
<div class="card p-3 mt-3">

  <input id="sessionName" class="form-control" placeholder="Nome da sessão (ex: corretor_joao)">
  <button class="btn btn-success mt-2" onclick="createSession()">
    Criar Sessão
  </button>

</div>

<!-- STATUS -->
<div class="card p-3 mt-3">

  <h5>Status</h5>
  <div id="status">🔴 Nenhuma sessão</div>

</div>

<!-- QR -->
<div class="card p-3 mt-3 text-center">

  <img id="qr" style="width:250px; display:none;" />

</div>

<!-- LOGS -->
<div class="card p-3 mt-3">

  <h5>Logs</h5>
  <pre id="logs" style="height:200px; overflow:auto;"></pre>

</div>

</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api/session";
let currentSession = null;
let qrLoop = null;
let statusLoop = null;

// ==========================
// CRIAR SESSÃO
// ==========================
async function createSession() {

  const session = document.getElementById("sessionName").value;

  log("🚀 Criando sessão: " + session);

  currentSession = session;

  const res = await fetch(`${API}/create`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ session })
  });

  const data = await res.json();

  log("STATUS: " + data.status);

  startStatusLoop();
  startQrLoop();
}

// ==========================
// STATUS LOOP
// ==========================
function startStatusLoop() {

  if (statusLoop) clearInterval(statusLoop);

  statusLoop = setInterval(async () => {

    const res = await fetch(`${API}/${currentSession}/status`);
    const data = await res.json();

    log("STATUS: " + data.status);

    document.getElementById("status").innerText =
      data.status === "CONNECTED"
        ? "🟢 Conectado"
        : "🟡 " + data.status;

  }, 3000);
}

// ==========================
// QR LOOP INTELIGENTE
// ==========================
function startQrLoop() {

  if (qrLoop) clearInterval(qrLoop);

  qrLoop = setInterval(async () => {

    const res = await fetch(`${API}/${currentSession}/status`);
    const data = await res.json();

    if (data.qrcode) {
      document.getElementById("qr").src = data.qrcode;
      document.getElementById("qr").style.display = "block";
    }

    if (data.status === "CONNECTED") {
      clearInterval(qrLoop);
      log("🟢 QR finalizado");
    }

  }, 2000);
}

// ==========================
// LOGS
// ==========================
function log(msg) {
  const el = document.getElementById("logs");
  el.innerText += "➡️ " + msg + "\n";
}

</script>

{% endblock %}
