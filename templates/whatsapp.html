{% extends "base.html" %}
{% block content %}
<style>

body{
    background:#f1f5f9;
}


/* CONTAINER */

.container{
    max-width:1400px!important;
    width:95%;
}



/* TITULOS */

h2{
    font-weight:800;
    color:#0f172a;
    letter-spacing:-1px;
}


h4,h5{
    font-weight:800;
    color:#1e293b;
}



/* CARDS */

.card{
    border:none;
    border-radius:25px;
    padding:30px!important;
    background:#fff;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    animation:fade .4s ease;
    transition:.3s;
}


.card:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 40px rgba(15,23,42,.12);
}



/* CAMPOS */

label{
    display:block;
    font-size:14px;
    font-weight:800;
    color:#334155;
    margin-bottom:8px;
}


.form-control{
    width:100%;
    border-radius:16px;
    padding:15px 18px;
    border:1px solid #dbeafe;
    background:#f8fafc;
    font-size:15px;
    margin-bottom:18px;
    transition:.3s;
}


input.form-control{
    height:55px;
}


textarea.form-control{
    min-height:130px;
    resize:vertical;
}


.form-control:hover{
    background:#fff;
}


.form-control:focus{
    background:#fff;
    border-color:#2563eb;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
    transform:translateY(-1px);
}



/* BOTÕES */

.btn{

    border-radius:16px;
    padding:14px 28px;
    font-weight:800;
    border:none;
    transition:.3s!important;

}


.btn:hover{
    transform:translateY(-3px);
    filter:brightness(1.05);
}



/* CRIAR */

.btn-success{

background:linear-gradient(
135deg,
#22c55e,
#15803d
);

box-shadow:
0 8px 20px rgba(34,197,94,.25);

}



/* DISPARO */

.btn-primary{

background:linear-gradient(
135deg,
#3b82f6,
#1d4ed8
);

box-shadow:
0 8px 20px rgba(37,99,235,.25);

}



/* PERIGO */

.btn-danger{

background:linear-gradient(
135deg,
#ef4444,
#991b1b
);

}



/* STATUS */

#status{

margin-top:15px;
padding:18px;
border-radius:18px;
background:#f8fafc;
border:1px solid #e2e8f0;
font-size:16px;
font-weight:700;

}



/* QR CODE */

#boxQR{

background:linear-gradient(
135deg,
#fff,
#eff6ff
);

}


#qr{

border-radius:20px;
padding:15px;
background:white;

box-shadow:
0 10px 30px rgba(0,0,0,.12);

}



/* ENVIO */

#boxEnvio{

background:linear-gradient(
145deg,
#fff,
#f8fafc
);

}


#boxEnvio h4{

display:flex;
align-items:center;
gap:8px;
margin-bottom:20px;

}



/* LOGS */

#logsEnvio,
#logs{

background:#020617!important;
color:#22c55e!important;

border-radius:18px!important;

padding:20px!important;

font-family:
"JetBrains Mono",
monospace;

font-size:13px;

border:none;

}



/* LINHA */

hr{

border:0;
height:1px;
background:#e2e8f0;
margin:25px 0;

}



/* ANIMAÇÃO */

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:none;
}

}



/* MOBILE */

@media(max-width:768px){

.container{
padding:15px;
}


.card{
padding:20px!important;
}


.btn{
width:100%;
}


#qr{
width:220px!important;
}


.form-control{
font-size:16px;
}

}

</style>
<div class="container mt-4">


<h2>📲 WhatsApp SmartZen</h2>


<!-- ==========================
     CONEXÃO
========================== -->

<div class="card p-3 mt-3" id="boxCriar">

<h5>🔗 Conectar WhatsApp</h5>


<input 
id="sessionName"
class="form-control"
placeholder="Nome da sessão (ex: corretor_joao)">


<button 
class="btn btn-success mt-3"
onclick="createSession()">

🚀 Criar / Conectar

</button>


</div>



<!-- ==========================
     STATUS
========================== -->

<div class="card p-3 mt-3">

<h5>Status</h5>

<div id="status">
🔴 Nenhuma sessão conectada
</div>


</div>




<!-- ==========================
     QR CODE
========================== -->


<div class="card p-3 mt-3 text-center"
id="boxQR"
style="display:none;">


<h5>📱 Escaneie o QR Code</h5>


<img 
id="qr"
style="
width:280px;
display:none;
margin:auto;
">


</div>





<!-- ==========================
     ENVIO
========================== -->


<!-- ==========================
     ENVIO EM MASSA
========================== -->

<div class="card p-3 mt-3"
id="boxEnvio"
style="display:none;">


<h4>📤 Disparo WhatsApp</h4>


<label class="mt-2">
📱 Lista de contatos
</label>


<textarea
id="listaEnvio"
class="form-control"
rows="8"
placeholder="Jackson,5511920900085
Maria,5511988887777"></textarea>



<label class="mt-3">
💬 Mensagem
</label>


<textarea
id="mensagemEnvio"
class="form-control"
rows="6"
placeholder="Olá {nome}, tudo bem?
Seu telefone é {telefone}"></textarea>




<label class="mt-3">
⏱ Delay entre mensagens (segundos)
</label>


<input
id="delayEnvio"
type="number"
class="form-control"
value="3">





<button
class="btn btn-primary mt-3"
onclick="iniciarDisparo()">

🚀 Iniciar Disparo

</button>



<hr>


<h5>
📊 Logs do envio
</h5>


<pre id="logsEnvio"
style="
background:#111;
color:#00ff88;
padding:15px;
border-radius:10px;
height:250px;
overflow:auto;">
</pre>


</div>




<!-- ==========================
     LOGS
========================== -->


<div class="card p-3 mt-3">

<h5>Logs</h5>

<pre id="logs"></pre>


</div>


</div>



<script>


const API = "https://zoom-leggings-viability.ngrok-free.dev/api";

const TOKEN = "THISISMYSECURETOKEN";


let currentSession = null;

let qrLoop = null;

let statusLoop = null;





/*
==============================
 SALVAR SESSÃO
==============================
*/


function salvarSessao(session){

    localStorage.setItem(
        "smartzen_session",
        session
    );

}





function carregarSessao(){

    return localStorage.getItem(
        "smartzen_session"
    );

}







/*
==============================
 AO ABRIR PÁGINA
==============================
*/


window.onload = async function(){

    let sessao = carregarSessao();

    if(sessao){

        currentSession = sessao;

        verificarStatus();

    }

}




async function verificarStatus(){

    try{

        const res = await fetch(
        `${API}/${currentSession}/start-session`,
        {
            method:"POST",
            headers:{
                "Authorization":"Bearer "+TOKEN,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                waitQrCode:true
            })
        });


        const data = await res.json();


        console.log("STATUS:", data);


        if(data.status === "CONNECTED"){


            conectado();


        }else{


            document.getElementById("status").innerHTML =
            "🟡 Aguardando conexão: "+currentSession;


            document.getElementById("boxQR")
            .style.display="block";


            if(data.qrcode){

                mostrarQR(data.qrcode);

            }


        }


    }catch(e){

        console.log(e);

    }

}



/*
==============================
 CRIAR SESSÃO
==============================
*/


async function createSession(){


    const session =
    document.getElementById("sessionName")
    .value.trim();



    if(!session){

        alert("Digite o nome da sessão");

        return;

    }



    currentSession=session;


    salvarSessao(session);



    document.getElementById("boxQR")
    .style.display="block";



    log(
    "Criando sessão: "+session
    );



    try{


        const res = await fetch(
        `${API}/${session}/start-session`,
        {

        method:"POST",

        headers:{

        "Authorization":
        "Bearer "+TOKEN,

        "Content-Type":
        "application/json"

        },


        body:JSON.stringify({

        waitQrCode:true

        })


        });



        const data =
        await res.json();



        log(
        "Status: "+data.status
        );



        if(data.qrcode){

            mostrarQR(data.qrcode);

        }



        iniciarLoops();



    }catch(e){

        log(
        "Erro: "+e.message
        );

    }


}









/*
==============================
 LOOP STATUS
==============================
*/


function iniciarLoops(){


if(statusLoop)
clearInterval(statusLoop);



statusLoop=setInterval(async()=>{


try{


const res =
await fetch(
`${API}/${currentSession}/start-session`,
{

method:"POST",

headers:{

"Authorization":
"Bearer "+TOKEN

},

body:JSON.stringify({

waitQrCode:true

})

});


const data =
await res.json();



document.getElementById("status")
.innerHTML =
"Status: "+data.status;



if(data.status==="CONNECTED"){


conectado();


}



}catch(e){}



},3000);



}





/*
==============================
 QR
==============================
*/


function mostrarQR(qr){

    let img = document.getElementById("qr");


    // se vier somente base64
    if(!qr.startsWith("data:image")){
        qr = "data:image/png;base64," + qr;
    }


    img.src = qr;

    img.style.display="block";

}






/*
==============================
 QUANDO CONECTAR
==============================
*/


function conectado(){


if(qrLoop)
clearInterval(qrLoop);



document.getElementById("boxQR")
.style.display="none";



document.getElementById("boxCriar")
.style.display="none";



document.getElementById("boxEnvio")
.style.display="block";



document.getElementById("status")
.innerHTML =
"🟢 WhatsApp conectado: "
+currentSession;



log(
"WhatsApp conectado!"
);



}









/*
==============================
 ENVIAR
==============================
*/


async function sendMessage(){


let phone =
document.getElementById("phone")
.value;


let message =
document.getElementById("message")
.value;



if(!currentSession){

alert(
"Nenhuma sessão ativa"
);

return;

}



try{


const res =
await fetch(
"/whatsapp/enviar",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

session:currentSession,

numero:phone,

mensagem:message

})


});



const data =
await res.json();



log(
"Mensagem enviada"
);



}catch(e){

log(
"Erro envio: "+e.message
);

}



}








/*
==============================
 LOG
==============================
*/


function log(msg){


document.getElementById("logs")
.innerHTML +=
"➡️ "+msg+"\n";


}


     /*
==============================
 DISPARO EM MASSA
==============================
*/


async function iniciarDisparo(){


let texto =
document.getElementById("listaEnvio").value;


let mensagem =
document.getElementById("mensagemEnvio").value;



let delay =
parseInt(
document.getElementById("delayEnvio").value
);



if(!texto){

alert("Digite os contatos");

return;

}



if(!mensagem){

alert("Digite a mensagem");

return;

}



if(!delay || delay < 1){

delay = 3;

}




let contatos =
texto.split("\n")
.map(x=>x.trim())
.filter(x=>x);



logEnvio(
"🚀 Iniciando envio para "+contatos.length+" contatos"
);



for(let i=0;i<contatos.length;i++){


let linha = contatos[i];


let partes =
linha.split(",");



let nome =
(partes[0] || "cliente")
.trim();



let telefone =
(partes[1] || "")
.replace(/\D/g,'');



if(!telefone){

logEnvio(
"❌ "+nome+" sem telefone"
);

continue;

}




let mensagemFinal =
mensagem
.replaceAll(
"{nome}",
nome
)
.replaceAll(
"{telefone}",
telefone
);





try{


let resposta =
await fetch(
"/whatsapp/enviar",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

session:currentSession,

numero:telefone,

mensagem:mensagemFinal

})


});



let data =
await resposta.json();



if(data.success === false){


logEnvio(
"❌ Falhou: "
+nome+
" - "+
telefone+
"\nResposta: "+
JSON.stringify(data)
);


}else{


logEnvio(
"✅ Enviado: "
+nome+
" - "+
telefone
);


}



}catch(e){


logEnvio(
"❌ Erro: "
+nome+
" - "+
telefone
);



}




await esperar(delay);



}



logEnvio(
"🏁 Disparo finalizado"
);



}





function esperar(segundos){

return new Promise(resolve=>{

setTimeout(
resolve,
segundos*1000
);

});


}





function logEnvio(msg){


let box =
document.getElementById("logsEnvio");


box.innerHTML +=
msg+"\n";


box.scrollTop =
box.scrollHeight;


}


</script>


{% endblock %}
