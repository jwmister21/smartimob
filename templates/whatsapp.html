{% extends "base.html" %}
{% block content %}
<style>
     .form-control{
    border-radius:15px;
    padding:14px;
    border:1px solid #dbeafe;
    background:#f8fafc;
    font-size:15px;
}


.form-control:focus{

border-color:#2563eb;

box-shadow:
0 0 0 3px rgba(37,99,235,.15);

}


.btn-primary{

background:linear-gradient(
135deg,
#2563eb,
#1d4ed8
);

border:none;
border-radius:15px;
font-weight:700;

}


.btn-success{

background:linear-gradient(
135deg,
#16a34a,
#15803d
);

border:none;
border-radius:15px;

}


.btn-danger{

background:linear-gradient(
135deg,
#dc2626,
#991b1b
);

border:none;
border-radius:15px;

}</style>
<div class="container mt-4">


<h2>📲 WhatsApp SmartZen</h2>


<!-- ==========================
     CONEXÃO
========================== -->

<div class="card p-3 mt-3" id="boxCriar">

<h5>🔗 Conectar WhatsApp</h5>


<input 
id="sessionName"
class="form-control"
placeholder="Nome da sessão (ex: corretor_joao)">


<button 
class="btn btn-success mt-3"
onclick="createSession()">

🚀 Criar / Conectar

</button>


</div>



<!-- ==========================
     STATUS
========================== -->

<div class="card p-3 mt-3">

<h5>Status</h5>

<div id="status">
🔴 Nenhuma sessão conectada
</div>


</div>




<!-- ==========================
     QR CODE
========================== -->


<div class="card p-3 mt-3 text-center"
id="boxQR"
style="display:none;">


<h5>📱 Escaneie o QR Code</h5>


<img 
id="qr"
style="
width:280px;
display:none;
margin:auto;
">


</div>





<!-- ==========================
     ENVIO
========================== -->


<!-- ==========================
     ENVIO EM MASSA
========================== -->

<div class="card p-3 mt-3"
id="boxEnvio"
style="display:none;">


<h4>📤 Disparo WhatsApp</h4>


<label class="mt-2">
📱 Lista de contatos
</label>


<textarea
id="listaEnvio"
class="form-control"
rows="8"
placeholder="Jackson,5511920900085
Maria,5511988887777"></textarea>



<label class="mt-3">
💬 Mensagem
</label>


<textarea
id="mensagemEnvio"
class="form-control"
rows="6"
placeholder="Olá {nome}, tudo bem?
Seu telefone é {telefone}"></textarea>




<label class="mt-3">
⏱ Delay entre mensagens (segundos)
</label>


<input
id="delayEnvio"
type="number"
class="form-control"
value="3">





<button
class="btn btn-primary mt-3"
onclick="iniciarDisparo()">

🚀 Iniciar Disparo

</button>



<hr>


<h5>
📊 Logs do envio
</h5>


<pre id="logsEnvio"
style="
background:#111;
color:#00ff88;
padding:15px;
border-radius:10px;
height:250px;
overflow:auto;">
</pre>


</div>




<!-- ==========================
     LOGS
========================== -->


<div class="card p-3 mt-3">

<h5>Logs</h5>

<pre id="logs"></pre>


</div>


</div>



<script>


const API = "https://zoom-leggings-viability.ngrok-free.dev/api";

const TOKEN = "THISISMYSECURETOKEN";


let currentSession = null;

let qrLoop = null;

let statusLoop = null;





/*
==============================
 SALVAR SESSÃO
==============================
*/


function salvarSessao(session){

    localStorage.setItem(
        "smartzen_session",
        session
    );

}





function carregarSessao(){

    return localStorage.getItem(
        "smartzen_session"
    );

}







/*
==============================
 AO ABRIR PÁGINA
==============================
*/


window.onload = async function(){

    let sessao = carregarSessao();

    if(sessao){

        currentSession = sessao;

        verificarStatus();

    }

}




async function verificarStatus(){

    try{

        const res = await fetch(
        `${API}/${currentSession}/start-session`,
        {
            method:"POST",
            headers:{
                "Authorization":"Bearer "+TOKEN,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                waitQrCode:true
            })
        });


        const data = await res.json();


        console.log("STATUS:", data);


        if(data.status === "CONNECTED"){


            conectado();


        }else{


            document.getElementById("status").innerHTML =
            "🟡 Aguardando conexão: "+currentSession;


            document.getElementById("boxQR")
            .style.display="block";


            if(data.qrcode){

                mostrarQR(data.qrcode);

            }


        }


    }catch(e){

        console.log(e);

    }

}



/*
==============================
 CRIAR SESSÃO
==============================
*/


async function createSession(){


    const session =
    document.getElementById("sessionName")
    .value.trim();



    if(!session){

        alert("Digite o nome da sessão");

        return;

    }



    currentSession=session;


    salvarSessao(session);



    document.getElementById("boxQR")
    .style.display="block";



    log(
    "Criando sessão: "+session
    );



    try{


        const res = await fetch(
        `${API}/${session}/start-session`,
        {

        method:"POST",

        headers:{

        "Authorization":
        "Bearer "+TOKEN,

        "Content-Type":
        "application/json"

        },


        body:JSON.stringify({

        waitQrCode:true

        })


        });



        const data =
        await res.json();



        log(
        "Status: "+data.status
        );



        if(data.qrcode){

            mostrarQR(data.qrcode);

        }



        iniciarLoops();



    }catch(e){

        log(
        "Erro: "+e.message
        );

    }


}









/*
==============================
 LOOP STATUS
==============================
*/


function iniciarLoops(){


if(statusLoop)
clearInterval(statusLoop);



statusLoop=setInterval(async()=>{


try{


const res =
await fetch(
`${API}/${currentSession}/start-session`,
{

method:"POST",

headers:{

"Authorization":
"Bearer "+TOKEN

},

body:JSON.stringify({

waitQrCode:true

})

});


const data =
await res.json();



document.getElementById("status")
.innerHTML =
"Status: "+data.status;



if(data.status==="CONNECTED"){


conectado();


}



}catch(e){}



},3000);



}





/*
==============================
 QR
==============================
*/


function mostrarQR(qr){

    let img = document.getElementById("qr");


    // se vier somente base64
    if(!qr.startsWith("data:image")){
        qr = "data:image/png;base64," + qr;
    }


    img.src = qr;

    img.style.display="block";

}






/*
==============================
 QUANDO CONECTAR
==============================
*/


function conectado(){


if(qrLoop)
clearInterval(qrLoop);



document.getElementById("boxQR")
.style.display="none";



document.getElementById("boxCriar")
.style.display="none";



document.getElementById("boxEnvio")
.style.display="block";



document.getElementById("status")
.innerHTML =
"🟢 WhatsApp conectado: "
+currentSession;



log(
"WhatsApp conectado!"
);



}









/*
==============================
 ENVIAR
==============================
*/


async function sendMessage(){


let phone =
document.getElementById("phone")
.value;


let message =
document.getElementById("message")
.value;



if(!currentSession){

alert(
"Nenhuma sessão ativa"
);

return;

}



try{


const res =
await fetch(
"/whatsapp/enviar",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},


body:JSON.stringify({

session:currentSession,

numero:phone,

mensagem:message

})


});



const data =
await res.json();



log(
"Mensagem enviada"
);



}catch(e){

log(
"Erro envio: "+e.message
);

}



}








/*
==============================
 LOG
==============================
*/


function log(msg){


document.getElementById("logs")
.innerHTML +=
"➡️ "+msg+"\n";


}


     /*
==============================
 DISPARO EM MASSA
==============================
*/


async function iniciarDisparo(){


let texto =
document.getElementById("listaEnvio").value;


let mensagem =
document.getElementById("mensagemEnvio").value;



let delay =
parseInt(
document.getElementById("delayEnvio").value
);



if(!texto){

alert("Digite os contatos");

return;

}



if(!mensagem){

alert("Digite a mensagem");

return;

}



if(!delay || delay < 1){

delay = 3;

}




let contatos =
texto.split("\n")
.map(x=>x.trim())
.filter(x=>x);



logEnvio(
"🚀 Iniciando envio para "+contatos.length+" contatos"
);



for(let i=0;i<contatos.length;i++){


let linha = contatos[i];


let partes =
linha.split(",");



let nome =
(partes[0] || "cliente")
.trim();



let telefone =
(partes[1] || "")
.replace(/\D/g,'');



if(!telefone){

logEnvio(
"❌ "+nome+" sem telefone"
);

continue;

}




let mensagemFinal =
mensagem
.replaceAll(
"{nome}",
nome
)
.replaceAll(
"{telefone}",
telefone
);





try{


let resposta =
await fetch(
"/whatsapp/enviar",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

session:currentSession,

numero:telefone,

mensagem:mensagemFinal

})


});



let data =
await resposta.json();



if(data.success === false){


logEnvio(
"❌ Falhou: "
+nome+
" - "+
telefone+
"\nResposta: "+
JSON.stringify(data)
);


}else{


logEnvio(
"✅ Enviado: "
+nome+
" - "+
telefone
);


}



}catch(e){


logEnvio(
"❌ Erro: "
+nome+
" - "+
telefone
);



}




await esperar(delay);



}



logEnvio(
"🏁 Disparo finalizado"
);



}





function esperar(segundos){

return new Promise(resolve=>{

setTimeout(
resolve,
segundos*1000
);

});


}





function logEnvio(msg){


let box =
document.getElementById("logsEnvio");


box.innerHTML +=
msg+"\n";


box.scrollTop =
box.scrollHeight;


}


</script>


{% endblock %}
