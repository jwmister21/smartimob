{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h2>📲 WhatsApp Multi-Sessão SmartZen</h2>

<!-- CRIAR SESSÃO -->
<div class="card p-3 mt-3">

  <input id="sessionName" class="form-control" placeholder="Nome da sessão (ex: usuario1, loja1, corretor_joao)">
  
  <button class="btn btn-success mt-2" onclick="createSession()">
    🚀 Criar / Iniciar Sessão
  </button>

</div>

<!-- STATUS -->
<div class="card p-3 mt-3">

  <h5>Status da Sessão</h5>
  <div id="status">🔴 Nenhuma sessão ativa</div>

</div>

<!-- QR CODE -->
<div class="card p-3 mt-3 text-center">

  <img id="qr" style="width:250px; display:none;" />

</div>

<!-- ENVIAR MENSAGEM -->
<div class="card p-3 mt-3">

  <h5>📤 Enviar mensagem</h5>

  <input id="phone" class="form-control mb-2" placeholder="5511999999999">
  <input id="message" class="form-control mb-2" placeholder="Mensagem">

  <button class="btn btn-primary" onclick="sendMessage()">
    Enviar
  </button>

</div>

<!-- LOGS -->
<div class="card p-3 mt-3">

  <h5>Logs</h5>
  <pre id="logs" style="height:200px; overflow:auto;"></pre>

</div>

</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api";
const TOKEN = "THISISMYSECURETOKEN";

let currentSession = null;
let qrLoop = null;
let statusLoop = null;

// ==========================
// LOG
// ==========================
function log(msg) {
  const el = document.getElementById("logs");
  if (el) el.innerText += "➡️ " + msg + "\n";
}

// ==========================
// CRIAR / INICIAR SESSÃO
// ==========================
async function createSession() {

  const session = document.getElementById("sessionName").value.trim();

  if (!session) {
    log("❌ Digite o nome da sessão");
    return;
  }

  currentSession = session;

  log("🚀 Criando sessão: " + session);

  try {

    const res = await fetch(`${API}/${session}/start-session`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ waitQrCode: true })
    });

    const data = await res.json();

    log("STATUS: " + data.status);

    if (data.qrcode) {
      showQR(data.qrcode);
    }

    startQrLoop();
    startStatusLoop();

  } catch (err) {
    log("❌ ERRO createSession: " + err.message);
  }
}

// ==========================
// QR LOOP (ATUALIZA QR)
// ==========================
function startQrLoop() {

  if (qrLoop) clearInterval(qrLoop);

  qrLoop = setInterval(async () => {

    if (!currentSession) return;

    try {

      const res = await fetch(`${API}/${currentSession}/start-session`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + TOKEN,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ waitQrCode: true })
      });

      const data = await res.json();

      if (data.qrcode) {
        showQR(data.qrcode);
      }

      if (data.status === "CONNECTED") {
        log("🟢 Conectado!");
        clearInterval(qrLoop);
      }

      if (data.status === "FAILED" || data.status === "CLOSED") {
        log("🔴 Sessão caiu");
        clearInterval(qrLoop);
      }

    } catch (err) {
      log("❌ QR ERROR: " + err.message);
    }

  }, 2500);
}

// ==========================
// STATUS LOOP
// ==========================
function startStatusLoop() {

  if (statusLoop) clearInterval(statusLoop);

  statusLoop = setInterval(async () => {

    if (!currentSession) return;

    try {

      const res = await fetch(`${API}/${currentSession}/start-session`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + TOKEN
        }
      });

      const data = await res.json();

      document.getElementById("status").innerText =
        data.status === "CONNECTED"
          ? "🟢 Conectado"
          : "🟡 " + data.status;

    } catch (err) {
      log("❌ STATUS ERROR: " + err.message);
    }

  }, 3000);
}

// ==========================
// MOSTRAR QR
// ==========================
function showQR(qr) {
  const img = document.getElementById("qr");
  img.src = qr;
  img.style.display = "block";
}

// ==========================
// ENVIAR MENSAGEM
// ==========================
async function sendMessage() {

  const phone = document.getElementById("phone").value;
  const message = document.getElementById("message").value;

  if (!currentSession) {
    log("❌ Nenhuma sessão ativa");
    return;
  }

  try {

    const res = await fetch(`${API}/${currentSession}/send-message`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone, message })
    });

    await res.json();

    log("📤 Mensagem enviada: " + phone);

  } catch (err) {
    log("❌ SEND ERROR: " + err.message);
  }
}

// ==========================
// DISPARO EM MASSA
// ==========================
async function sendMass() {

  const phones = document.getElementById("phones").value
    .split("\n")
    .map(p => p.trim())
    .filter(Boolean);

  const message = document.getElementById("massMessage").value;

  if (!currentSession) {
    log("❌ Nenhuma sessão ativa");
    return;
  }

  log("🚀 Iniciando disparo em massa...");

  for (let phone of phones) {

    try {

      await fetch(`${API}/${currentSession}/send-message`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + TOKEN,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ phone, message })
      });

      log("✔ enviado: " + phone);

    } catch (err) {
      log("❌ erro: " + phone);
    }

    await new Promise(r => setTimeout(r, 1500));
  }

  log("✅ disparo finalizado");
}

  function salvarSessao(session) {
    const key = "smartzen_session_" + window.USER_ID;
    localStorage.setItem(key, session);
}
</script>

{% endblock %}
