{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h2>📲 WhatsApp Multi-Sessão SmartZen</h2>

<!-- CRIAR SESSÃO -->
<div class="card p-3 mt-3">

  <input id="sessionName" class="form-control" placeholder="Nome da sessão (ex: usuario1, loja1, corretor_joao)">
  
  <button class="btn btn-success mt-2" onclick="createSession()">
    🚀 Criar / Iniciar Sessão
  </button>

</div>

<!-- STATUS -->
<div class="card p-3 mt-3">

  <h5>Status da Sessão</h5>
  <div id="status">🔴 Nenhuma sessão ativa</div>

</div>

<!-- QR CODE -->
<div class="card p-3 mt-3 text-center">

  <img id="qr" style="width:250px; display:none;" />

</div>

<!-- ENVIAR MENSAGEM -->
<div class="card p-3 mt-3">

  <h5>📤 Enviar mensagem</h5>

  <input id="phone" class="form-control mb-2" placeholder="5511999999999">
  <input id="message" class="form-control mb-2" placeholder="Mensagem">

  <button class="btn btn-primary" onclick="sendMessage()">
    Enviar
  </button>

</div>

<!-- LOGS -->
<div class="card p-3 mt-3">

  <h5>Logs</h5>
  <pre id="logs" style="height:200px; overflow:auto;"></pre>

</div>

</div>
<script>
const API = "https://zoom-leggings-viability.ngrok-free.dev/api";
const TOKEN = "THISISMYSECURETOKEN";

let currentSession = null;
let qrLoop = null;
let statusLoop = null;

/* =========================
   SALVAR SESSÃO POR USUÁRIO
========================= */
function salvarSessao(session) {
    const key = "smartzen_session_" + window.USER_ID;
    localStorage.setItem(key, session);
}

function carregarSessao() {
    const key = "smartzen_session_" + window.USER_ID;
    return localStorage.getItem(key);
}

/* =========================
   CRIAR / INICIAR SESSÃO
========================= */
async function createSession() {

    const session = document.getElementById("sessionName").value.trim();

    if (!session) {
        alert("Digite o nome da sessão");
        return;
    }

    currentSession = session;

    try {

        const res = await fetch(`${API}/${session}/start-session`, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + TOKEN,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ waitQrCode: true })
        });

        const data = await res.json();

        log("STATUS: " + data.status);

        // 🔥 SALVA SESSÃO POR USUÁRIO
        salvarSessao(session);

        startStatusLoop();
        startQrLoop();

    } catch (err) {
        log("ERRO: " + err.message);
    }
}

/* =========================
   STATUS LOOP
========================= */
function startStatusLoop() {

    if (statusLoop) clearInterval(statusLoop);

    statusLoop = setInterval(async () => {

        const res = await fetch(`${API}/${currentSession}/start-session`, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + TOKEN
            },
            body: JSON.stringify({ waitQrCode: true })
        });

        const data = await res.json();

        document.getElementById("status").innerText =
            "Status: " + data.status;

    }, 3000);
}

/* =========================
   QR LOOP
========================= */
function startQrLoop() {

    if (qrLoop) clearInterval(qrLoop);

    qrLoop = setInterval(async () => {

        const res = await fetch(`${API}/${currentSession}/start-session`, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + TOKEN
            },
            body: JSON.stringify({ waitQrCode: true })
        });

        const data = await res.json();

        if (data.qrcode) {
            document.getElementById("qr").src = data.qrcode;
            document.getElementById("qr").style.display = "block";
        }

        if (data.status === "CONNECTED") {
            clearInterval(qrLoop);
            log("🟢 Conectado!");
        }

    }, 2500);
}

/* =========================
   ENVIAR MENSAGEM SIMPLES
========================= */
async function sendMessage() {

    const phone = document.getElementById("phone").value;
    const message = document.getElementById("message").value;

    if (!currentSession) {
        alert("Nenhuma sessão ativa");
        return;
    }

    const res = await fetch("/whatsapp/enviar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            session: currentSession,
            numero: phone,
            mensagem: message
        })
    });

    const data = await res.json();
    log("Mensagem enviada");
}

/* =========================
   LOG
========================= */
function log(msg) {
    console.log(msg);
}
</script>

{% endblock %}
