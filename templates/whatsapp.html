{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h2>📲 WhatsApp Multi-Sessão SmartZen</h2>

<!-- CRIAR SESSÃO -->
<div class="card p-3 mt-3">

  <input id="sessionName" class="form-control" placeholder="Nome da sessão (ex: corretor_joao)">
  <button class="btn btn-success mt-2" onclick="createSession()">
    Criar Sessão
  </button>

</div>

<!-- STATUS -->
<div class="card p-3 mt-3">

  <h5>Status</h5>
  <div id="status">🔴 Nenhuma sessão</div>

</div>

<!-- QR -->
<div class="card p-3 mt-3 text-center">

  <img id="qr" style="width:250px; display:none;" />

</div>

<!-- LOGS -->
<div class="card p-3 mt-3">

  <h5>Logs</h5>
  <pre id="logs" style="height:200px; overflow:auto;"></pre>

</div>

</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api";
const TOKEN = "THISISMYSECURETOKEN";

let currentSession = null;
let qrLoop = null;

// ==========================
// CRIAR SESSÃO
// ==========================
async function createSession() {

  const session = document.getElementById("sessionName").value;
  currentSession = session;

  log("🚀 Criando sessão: " + session);

  const res = await fetch(`${API}/${session}/start-session`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TOKEN,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ waitQrCode: true })
  });

  const data = await res.json();

  log("STATUS: " + data.status);

  if (data.qrcode) {
    showQR(data.qrcode);
  }

  startQrLoop();
}

// ==========================
// LOOP QR
// ==========================
function startQrLoop() {

  if (qrLoop) clearInterval(qrLoop);

  qrLoop = setInterval(async () => {

    const res = await fetch(`${API}/${currentSession}/start-session`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ waitQrCode: true })
    });

    const data = await res.json();

    log("STATUS: " + data.status);

    if (data.qrcode) {
      showQR(data.qrcode);
    }

    if (data.status === "CONNECTED") {
      clearInterval(qrLoop);
      log("🟢 CONECTADO");
    }

    if (data.status === "CLOSED" || data.status === "FAILED") {
      clearInterval(qrLoop);
      log("🔴 REINICIANDO SESSÃO...");
      setTimeout(() => createSession(), 3000);
    }

  }, 3000);
}

// ==========================
// QR
// ==========================
function showQR(qr) {
  const img = document.getElementById("qr");
  img.src = qr;
  img.style.display = "block";
}

// ==========================
// LOG
// ==========================
function log(msg) {
  const el = document.getElementById("logs");
  el.innerText += "➡️ " + msg + "\n";
}

</script>

{% endblock %}
