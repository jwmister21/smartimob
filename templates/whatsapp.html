{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

<h2>📲 WhatsApp Multi-Sessão SmartZen</h2>

<!-- CRIAR SESSÃO -->
<div class="card p-3 mt-3">

  <input id="sessionName" class="form-control" placeholder="Nome da sessão (ex: usuario1, loja1, corretor_joao)">
  
  <button class="btn btn-success mt-2" onclick="createSession()">
    🚀 Criar / Iniciar Sessão
  </button>

</div>

<!-- STATUS -->
<div class="card p-3 mt-3">

  <h5>Status da Sessão</h5>
  <div id="status">🔴 Nenhuma sessão ativa</div>

</div>

<!-- QR CODE -->
<div class="card p-3 mt-3 text-center">

  <img id="qr" style="width:250px; display:none;" />

</div>

<!-- ENVIAR MENSAGEM -->
<div class="card p-3 mt-3">

  <h5>📤 Enviar mensagem</h5>

  <input id="phone" class="form-control mb-2" placeholder="5511999999999">
  <input id="message" class="form-control mb-2" placeholder="Mensagem">

  <button class="btn btn-primary" onclick="sendMessage()">
    Enviar
  </button>

</div>

<!-- LOGS -->
<div class="card p-3 mt-3">

  <h5>Logs</h5>
  <pre id="logs" style="height:200px; overflow:auto;"></pre>

</div>

</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api";
const TOKEN = "THISISMYSECURETOKEN";

let currentSession = null;
let qrLoop = null;
let statusLoop = null;

// ==========================
// CRIAR / INICIAR SESSÃO
// ==========================
async function createSession() {

  const session = document.getElementById("sessionName").value.trim();

  if (!session) {
    log("❌ Digite o nome da sessão");
    return;
  }

  currentSession = session;

  log("🚀 Iniciando sessão: " + session);

  try {

    const res = await fetch(`${API}/${session}/start-session`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ waitQrCode: true })
    });

    const data = await res.json();

    log("STATUS: " + data.status);

    if (data.qrcode) {
      showQR(data.qrcode);
    }

    startLoops();

  } catch (err) {
    log("❌ ERRO: " + err.message);
  }
}

// ==========================
// LOOPS (QR + STATUS)
// ==========================
function startQrLoop() {

  if (qrLoop) clearInterval(qrLoop);

  qrLoop = setInterval(async () => {

    const res = await fetch(`${API}/${currentSession}/qr`);
    const data = await res.json();

    if (data.qrcode) {
      document.getElementById("qr").src = data.qrcode;
      document.getElementById("qr").style.display = "block";
    }

    if (data.status === "CONNECTED") {
      clearInterval(qrLoop);
      log("🟢 Conectado!");
    }

    if (data.status === "CLOSED" || data.status === "FAILED") {
      clearInterval(qrLoop);
      log("🔴 Sessão caiu");
    }

  }, 2000);
}

  // QR LOOP
  qrLoop = setInterval(async () => {

    try {
      const res = await fetch(`${API}/${currentSession}/start-session`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + TOKEN,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ waitQrCode: true })
      });

      const data = await res.json();

      if (data.qrcode) {
        showQR(data.qrcode);
      }

      if (data.status === "CONNECTED") {
        clearInterval(qrLoop);
        log("🟢 QR finalizado");
      }

      if (data.status === "CLOSED" || data.status === "FAILED") {
        clearInterval(qrLoop);
        log("🔴 Sessão caiu, reiniciando...");
        setTimeout(() => createSession(), 3000);
      }

    } catch (err) {
      log("❌ QR ERROR: " + err.message);
    }

  }, 2500);
}

// ==========================
// ENVIAR MENSAGEM
// ==========================
async function sendMessage() {

  const phone = document.getElementById("phone").value;
  const message = document.getElementById("message").value;

  if (!currentSession) {
    log("❌ Nenhuma sessão ativa");
    return;
  }

  try {

    const res = await fetch(`${API}/${currentSession}/send-message`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone, message })
    });

    const data = await res.json();

    log("📤 Mensagem enviada");

  } catch (err) {
    log("❌ SEND ERROR: " + err.message);
  }
}

// ==========================
// QR
// ==========================
function showQR(qr) {
  const img = document.getElementById("qr");
  img.src = qr;
  img.style.display = "block";
}

// ==========================
// LOG
// ==========================
function log(msg) {
  const el = document.getElementById("logs");
  el.innerText += "➡️ " + msg + "\n";
}

</script>

{% endblock %}
