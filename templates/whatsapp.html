{% extends "base.html" %}

{% block title %}WhatsApp{% endblock %}
{% block pagina %}WhatsApp do Corretor{% endblock %}

{% block content %}

<style>

.whatsapp-card{
    background:#111827;
    border:1px solid #374151;
    border-radius:16px;
    padding:25px;
    max-width:700px;
}

.whatsapp-status{
    background:#1f2937;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
}

.whatsapp-btn{
    background:#22c55e;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.whatsapp-btn:hover{
    opacity:.9;
}

#qr{
    width:280px;
    margin-top:20px;
    border-radius:12px;
}

.conectado{
    background:#064e3b;
    color:#6ee7b7;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    font-weight:600;
}

</style>

<div class="whatsapp-card">

    <h2>📱 WhatsApp do Corretor</h2>

    <br>

    <div class="whatsapp-status">

        <p><strong>Sessão:</strong> {{ sessao }}</p>

        <p>
            <strong>Status:</strong>
            <span id="status">
                {{ status }}
            </span>
        </p>

        <p>
            <strong>Número:</strong>
            <span id="numero">
                {{ numero or "Não conectado" }}
            </span>
        </p>

    </div>

    <button
        id="btnConectar"
        class="whatsapp-btn"
        onclick="conectarWhatsapp()">
        Conectar WhatsApp
    </button>

    <div id="areaQr">

        <img
            id="qr"
            style="display:none;"
        >

    </div>

</div>
<script>

setInterval(verificarStatus, 3000);

async function verificarStatus(){

    const resp =
        await fetch('/status_whatsapp');

    const dados =
        await resp.json();

    if(dados.status === "conectado"){

        document.getElementById("status")
            .innerText = "Conectado";

        document.getElementById("numero")
            .innerText = dados.numero;

        document.getElementById("btnConectar")
            .style.display = "none";

        document.getElementById("qr")
            .style.display = "none";

        document.getElementById("areaQr").innerHTML = `
            <div class="conectado">
                ✅ WhatsApp conectado com sucesso
            </div>
        `;
    }
}

</script>

{% endblock %}
