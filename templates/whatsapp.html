<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>WhatsApp SmartZen</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #111827;
      padding: 30px;
      border-radius: 16px;
      width: 420px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .status {
      margin: 10px 0;
      padding: 8px;
      border-radius: 8px;
      background: #1f2937;
    }

    .status span {
      font-weight: bold;
      color: #22c55e;
    }

    img {
      width: 260px;
      height: 260px;
      margin: 20px 0;
      border-radius: 12px;
      background: white;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-green {
      background: #22c55e;
      color: black;
    }

    .btn-blue {
      background: #3b82f6;
      color: white;
    }

    .btn-red {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>📲 WhatsApp SmartZen</h1>

  <div class="status">
    Status: <span id="status">Desconectado</span>
  </div>

  <img id="qr" src="" alt="QR Code">

  <button class="btn-green" onclick="startSession()">
    Iniciar Sessão
  </button>

  <button class="btn-blue" onclick="loadQR()">
    Atualizar QR Code
  </button>

  <button class="btn-red" onclick="logout()">
    Desconectar
  </button>

</div>

<script>
const session = "smartzen1";
const token = "THISISMYSECURETOKEN";

// 🔥 inicia sessão
function startSession() {
  fetch(`/api/${session}/start-session`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ waitQrCode: true })
  })
  .then(res => res.json())
  .then(data => {
    console.log(data);
    loadQR();
  });
}

// 🔥 pega QR Code
function loadQR() {
  fetch(`/api/${session}/qrcode-session`, {
    headers: {
      "Authorization": "Bearer " + token
    }
  })
  .then(res => res.blob())
  .then(blob => {
    document.getElementById("qr").src = URL.createObjectURL(blob);
  })
  .catch(() => {
    document.getElementById("status").innerText = "QR não disponível";
  });
}

// 🔥 logout
function logout() {
  fetch(`/api/${session}/logout-session`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + token
    }
  })
  .then(() => {
    document.getElementById("status").innerText = "Desconectado";
  });
}

// auto load QR
loadQR();
</script>

</body>
</html>
