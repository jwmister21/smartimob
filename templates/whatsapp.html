{% extends "base.html" %}

{% block content %}
<div class="container mt-5">

  <div class="card shadow-lg p-4">

    <h2 class="text-center mb-3">📲 WhatsApp SmartZen - Debug</h2>

    <!-- STATUS -->
    <div id="status" class="text-center mb-3">
      🔴 Desconectado
    </div>

    <!-- LOGS -->
    <div class="alert alert-dark" style="height:150px; overflow:auto; font-size:12px;" id="logs">
      Logs iniciados...
    </div>

    <!-- QR CODE -->
    <div class="text-center mb-3">
      <img id="qr" style="width:260px; display:none;" />
    </div>

    <div class="text-center">

      <button class="btn btn-success mb-2" onclick="startSession()">
        Iniciar Sessão
      </button>

      <button class="btn btn-danger mb-2" onclick="logoutSession()">
        Desconectar
      </button>

      <hr>

      <input id="phone" class="form-control mb-2" placeholder="5511999999999">
      <input id="message" class="form-control mb-2" placeholder="Mensagem">

      <button class="btn btn-primary" onclick="sendMessage()">
        Enviar Mensagem
      </button>

    </div>

  </div>
</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api/smartzen1";
const TOKEN = "THISISMYSECURETOKEN";

function log(msg) {
  console.log(msg);
  document.getElementById("logs").innerHTML += "<br>➡️ " + msg;
}

// ======================
// START SESSION
// ======================
async function startSession() {
  try {
    log("Iniciando sessão...");

    const res = await fetch(`${API}/start-session`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ waitQrCode: true })
    });

    const text = await res.text();
    log("Start response: " + text);

    await loadQR();

  } catch (err) {
    log("ERRO startSession: " + err.message);
  }
}

// ======================
// QR CODE (CORRIGIDO)
// ======================
async function loadQR() {
  try {
    log("Buscando QR Code...");

    const res = await fetch(`${API}/qrcode-session`, {
      method: "GET",
      headers: {
        "Authorization": "Bearer " + TOKEN
      }
    });

    const text = await res.text();
    log("QR raw response: " + text);

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      log("QR não é JSON puro");
    }

    // CASO 1: base64
    if (data?.qrcode || data?.qr || data?.base64) {
      const qr = data.qrcode || data.qr || data.base64;
      document.getElementById("qr").src = qr.startsWith("data:")
        ? qr
        : "data:image/png;base64," + qr;

      document.getElementById("qr").style.display = "block";
      document.getElementById("status").innerHTML = "🟡 QR Code gerado";
      return;
    }

    // CASO 2: string simples
    if (typeof data === "string") {
      document.getElementById("qr").src = "data:image/png;base64," + data;
      document.getElementById("qr").style.display = "block";
      return;
    }

    log("QR não encontrado no retorno");

  } catch (err) {
    log("ERRO loadQR: " + err.message);
  }
}

// ======================
// SEND MESSAGE
// ======================
async function sendMessage() {
  try {
    const phone = document.getElementById("phone").value;
    const message = document.getElementById("message").value;

    log("Enviando mensagem...");

    const res = await fetch(`${API}/send-message`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone, message })
    });

    const text = await res.text();
    log("Send response: " + text);

  } catch (err) {
    log("ERRO sendMessage: " + err.message);
  }
}

// ======================
// LOGOUT
// ======================
async function logoutSession() {
  try {
    log("Desconectando...");

    const res = await fetch(`${API}/logout-session`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN
      }
    });

    const text = await res.text();
    log("Logout: " + text);

    document.getElementById("status").innerHTML = "🔴 Desconectado";
    document.getElementById("qr").style.display = "none";

  } catch (err) {
    log("ERRO logout: " + err.message);
  }
}

</script>

{% endblock %}
