<button onclick="criar()">Criar WhatsApp</button>
<button onclick="qr()">Ver QR</button>

<pre id="saida"></pre>

<script>
async function criar(){
  let r = await fetch("/whatsapp/criar/smartzen1");
  document.getElementById("saida").innerText = await r.text();
}

async function qr(){
  let r = await fetch("/whatsapp/qr/smartzen1");
  let data = await r.json();

  document.getElementById("saida").innerText =
    data.qrcode?.base64 || JSON.stringify(data);
}
</script>
