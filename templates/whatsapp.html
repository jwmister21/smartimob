<div class="card-whatsapp">

    <h2>
        <i class="bi bi-whatsapp"></i>
        WhatsApp do Corretor
    </h2>

    <div class="status-box">

        <p>
            <strong>Sessão:</strong>
            {{ sessao }}
        </p>

        <p>
            <strong>Status:</strong>
            <span id="status">
                {{ status }}
            </span>
        </p>

        <p>
            <strong>Número:</strong>
            {{ numero or "Não conectado" }}
        </p>

    </div>

    <button
        class="btn-whatsapp"
        onclick="conectarWhatsapp()">
        Conectar WhatsApp
    </button>

    <div id="areaQr">

        <img
            id="qr"
            style="display:none; width:280px; margin-top:20px;"
        >

    </div>

</div>
<style>

.card-whatsapp{
    background:#111827;
    border:1px solid #374151;
    border-radius:16px;
    padding:25px;
    max-width:700px;
}

.status-box{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
}

.btn-whatsapp{
    background:#25D366;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

</style>
