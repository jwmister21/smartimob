{% extends "base.html" %}

{% block content %}
<div class="container mt-5">

  <div class="card shadow-lg p-4">

    <h2 class="text-center mb-4">📲 WhatsApp SmartZen</h2>

    <div class="text-center">

      <div id="status" class="mb-3">
        🔴 Desconectado
      </div>

      <!-- QR CODE -->
      <div id="qr-box" class="mb-4">
        <img id="qr-img" style="width: 250px; display:none;" />
      </div>

      <button class="btn btn-success" onclick="startSession()">
        Iniciar Conexão
      </button>

      <button class="btn btn-danger" onclick="logoutSession()">
        Desconectar
      </button>

      <hr>

      <h5>Enviar mensagem teste</h5>

      <input id="phone" class="form-control mb-2" placeholder="5511999999999">
      <input id="message" class="form-control mb-2" placeholder="Mensagem">

      <button class="btn btn-primary" onclick="sendMessage()">
        Enviar
      </button>

      <hr>

      <small id="log" style="white-space: pre-wrap; text-align:left; display:block;"></small>

    </div>
  </div>
</div>

<script>

const API = "https://zoom-leggings-viability.ngrok-free.dev/api/smartzen1";
const TOKEN = "THISISMYSECURETOKEN";

let qrInterval = null;

// LOGS NA TELA
function log(msg) {
  console.log(msg);
  document.getElementById("log").innerText += "➡️ " + msg + "\n";
}

// ======================
// START SESSION + POLLING
// ======================
async function startSession() {
  log("Iniciando sessão...");

  try {
    const res = await fetch(`${API}/start-session`, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + TOKEN,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ waitQrCode: true })
    });

    const data = await res.json();
    console.log(data);
    log("Start response: " + JSON.stringify(data));

    document.getElementById("status").innerText =
      data.status === "QRCODE"
        ? "🟡 Escaneie o QR Code"
        : "🔄 " + data.status;

    // se já vier QR direto
    if (data.qrcode) {
      showQR(data.qrcode);
    }

    // começa polling automático
    startQRLoop();

  } catch (err) {
    console.error(err);
    log("ERRO startSession: " + err.message);
  }
}

// ======================
// POLLING AUTOMÁTICO QR
// ======================
function startQRLoop() {

  if (qrInterval) clearInterval(qrInterval);

  qrInterval = setInterval(async () => {
    try {
      log("Buscando QR Code...");

      const res = await fetch(`${API}/start-session`, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + TOKEN,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ waitQrCode: true })
      });

      const data = await res.json();
      console.log(data);
      log("QR response: " + JSON.stringify(data.status));

      if (data.status === "QRCODE" && data.qrcode) {
        showQR(data.qrcode);
        document.getElementById("status").innerText = "🟡 Escaneie o QR Code";
      }

      if (data.status === "CONNECTED") {
        document.getElementById("status").innerText = "🟢 Conectado!";
        clearInterval(qrInterval);
      }

    } catch (err) {
      log("ERRO loadQR: " + err.message);
    }
  }, 3000);
}

// ======================
// MOSTRAR QR
// ======================
function showQR(qr) {
  const img = document.getElementById("qr-img");
  img.src = qr;
  img.style.display = "block";
}

// ======================
// ENVIAR MENSAGEM
// ======================
async function sendMessage() {

  const phone = document.getElementById("phone").value;
  const message = document.getElementById("message").value;

  const res = await fetch(`${API}/send-message`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TOKEN,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ phone, message })
  });

  const data = await res.json();
  console.log(data);
  log("Mensagem enviada");
  alert("Enviado!");
}

// ======================
// LOGOUT
// ======================
async function logoutSession() {

  await fetch(`${API}/logout-session`, {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + TOKEN
    }
  });

  document.getElementById("status").innerText = "🔴 Desconectado";
  document.getElementById("qr-img").style.display = "none";

  if (qrInterval) clearInterval(qrInterval);
  log("Sessão encerrada");
}

</script>

{% endblock %}
