<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Criar Conta - SMARTZEN IMOB</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}body{background:#f5f7fb;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px;color:#111827}.login-container{width:100%;max-width:480px}.logo-topo{text-align:center;font-size:2.3rem;font-weight:800;margin-bottom:25px;color:#0ea5e9}.logo-topo span{color:#111827}.login-box{background:#fff;padding:40px;border-radius:22px;box-shadow:0 10px 40px rgba(15,23,42,.08);border:1px solid #edf2f7}.titulo{text-align:center;margin-bottom:25px}.titulo h3{font-size:1.6rem;margin-bottom:8px}.titulo p{color:#6b7280;font-size:.95rem}.trial{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8;padding:13px;border-radius:12px;text-align:center;font-weight:700;margin-bottom:24px}.erro{background:#fee2e2;border:1px solid #fecaca;color:#b91c1c;padding:12px;border-radius:10px;margin-bottom:20px;text-align:center}.form-group{margin-bottom:18px}label{display:block;margin-bottom:8px;font-size:.92rem;font-weight:600;color:#374151}input{width:100%;padding:14px;border-radius:12px;border:1px solid #dbe3ee;background:#fff;color:#111827;font-size:15px}input:focus{outline:none;border-color:#0ea5e9;box-shadow:0 0 0 4px rgba(14,165,233,.15)}.termos-box{display:flex;align-items:flex-start;gap:10px;margin:5px 0 22px}.termos-box input{width:auto;margin-top:4px}.termos-box label{margin:0;font-size:.85rem;line-height:1.5;color:#6b7280;font-weight:500}.termos-box a{color:#0ea5e9;text-decoration:none;font-weight:700}.btn-registro{width:100%;border:0;padding:15px;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;color:#fff;background:#0ea5e9}.link-login{margin-top:25px;text-align:center;color:#6b7280;font-size:.92rem}.link-login a{color:#0ea5e9;text-decoration:none;font-weight:700}@media(max-width:520px){.login-box{padding:28px}}</style></head>
<body><div class="login-container"><div class="logo-topo">SMART<span>ZEN</span></div><div class="login-box"><div class="titulo"><h3>🚀 Crie sua Conta</h3><p>Gerencie imóveis, clientes e leads em um só lugar.</p></div><div class="trial">Teste gratuito por 24 horas • Sem cobrança automática</div>{% if erro %}<div class="erro">⚠️ {{ erro }}</div>{% endif %}<form method="POST"><div class="form-group"><label>Nome completo</label><input type="text" name="nome" placeholder="Ex: João Corretor" required></div><div class="form-group"><label>E-mail corporativo</label><input type="email" name="email" placeholder="seu@email.com" required></div><div class="form-group"><label>Sua senha</label><input type="password" name="senha" minlength="6" placeholder="Mínimo de 6 caracteres" required></div><div class="form-group"><label>Nome da imobiliária / empresa</label><input type="text" name="nome_empresa" placeholder="Ex: Smart Imóveis"></div><div class="termos-box"><input type="checkbox" id="aceite_termos" required><label for="aceite_termos">Li e concordo com os <a href="/termos" target="_blank">Termos de Uso</a> e a <a href="/privacidade" target="_blank">Política de Privacidade</a>.</label></div><button type="submit" class="btn-registro">Começar teste de 24 horas</button></form><div class="link-login">Já tem uma conta? <a href="/login">Fazer login</a></div></div></div></body></html>
