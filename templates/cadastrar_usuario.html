<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - SMARTZEN IMOB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #0b0f19; /* Fundo escuro idêntico ao sistema */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }
        .logo-topo {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #0ea5e9;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .logo-topo span {
            color: white;
        }
        .login-box {
            background: #111827;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #9ca3af;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #0ea5e9;
            outline: none;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }
        .btn-registro {
            width: 100%;
            padding: 12px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .btn-registro:hover {
            background: #0284c7;
        }
        .link-login {
            text-align: center;
            margin-top: 25px;
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .link-login a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: bold;
        }
        .link-login a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    
    <div class="logo-topo">SMART<span>ZEN</span></div>

    <div class="login-box">
        <h3 style="margin-top: 0; margin-bottom: 25px; text-align: center; font-size: 1.3rem;">🚀 Crie sua Conta</h3>
        
        <form method="POST">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" name="nome" placeholder="Ex: João Corretor" required>
            </div>

            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label>Sua Senha</label>
                <input type="password" name="senha" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label>Nome da Imobiliária / Empresa (Opcional)</label>
                <input type="text" name="nome_empresa" placeholder="Ex: Smart Imóveis">
            </div>

            <button type="submit" class="btn-registro">Cadastrar e Começar</button>
        </form>

        <div class="link-login">
            Já tem uma conta? <a href="/login">Fazer Login</a>
        </div>
    </div>
</div>

</body>
</html>
