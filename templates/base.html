<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SMARTZEN IMOB{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
{% set path = request.path %}
<style>
/* =========================
   ESTILO CLEAN & WHITE
========================= */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

body { background: #f8fafc; color: #1e293b; transition: all .25s ease; }

/* SIDEBAR */
.sidebar {
    position: fixed; left: 0; top: 0; width: 260px; height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e2e8f0;
    padding: 25px;
    display: flex; flex-direction: column;
}

.logo { width: 150px; height: auto; object-fit: contain; }
.logo-area { display: flex; align-items: center; justify-content: center; margin-bottom: 30px; }

.menu { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.menu-section-title {
    color: #94a3b8; font-size: 10px; text-transform: uppercase;
    font-weight: 700; margin: 15px 0 5px 12px;
}

.menu a {
    text-decoration: none; color: #64748b; padding: 10px 12px;
    border-radius: 8px; display: flex; align-items: center; gap: 10px;
    font-size: 14px; transition: .2s;
}

.menu a:hover { background: #f1f5f9; color: #0f172a; }
.menu a.active { background: #eff6ff; color: #2563eb; font-weight: 600; }

/* MAIN CONTENT */
.main { margin-left: 260px; min-height: 100vh; padding: 35px; }

.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

/* CONTROLES E DROPDOWN */
.user-controls { display: flex; align-items: center; gap: 15px; }
.dropbtn {
    background: #ffffff; border: 1px solid #e2e8f0; color: #1e293b;
    padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px;
}
.dropdown-content {
    display: none; position: absolute; right: 0; background: #ffffff;
    min-width: 160px; border-radius: 8px; border: 1px solid #e2e8f0;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); z-index: 1000;
}
.dropdown:hover .dropdown-content { display: block; }
.dropdown-content a { color: #1e293b; padding: 10px 16px; text-decoration: none; display: block; }
.dropdown-content a:hover { background: #f8fafc; }

/* BADGES E NOTIFICAÇÕES */
.badge {
    background: #ef4444; color: white; padding: 2px 6px; border-radius: 50%;
    font-size: 10px; position: absolute; top: -5px; right: -5px;
}
.icone-topo { position: relative; font-size: 20px; cursor: pointer; }

/* CHAT WIDGET */
.chat-widget {
    position: fixed; bottom: 100px; right: 25px; width: 300px; height: 400px;
    background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px;
    display: none; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}
.chat-footer { padding: 15px; border-top: 1px solid #f1f5f9; }
#texto_cliente { width: 100%; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; }
.btn-analisar { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
.chat-float-btn { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%; background: #2563eb; color: white; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 10px 15px rgba(37,99,235,0.3); }
</style>
</head>
<body>

<div class="sidebar">
    <div class="logo-area">
        <img src="{{ url_for('static', filename='logo_smartzen.png') }}" class="logo">
    </div>
    <div class="menu">
        <div class="menu-section-title">Principal</div>
        <a href="/sistema">🏠 Dashboard</a>
        <div class="menu-section-title">CRM</div>
        <a href="/clientes" class="{% if '/clientes' in path %}active{% endif %}">👥 Clientes</a>
        <a href="/funil" class="{% if '/funil' in path %}active{% endif %}">⚡ Funil</a>
        <div class="menu-section-title">Imóveis</div>
        <a href="/imoveis" class="{% if '/imoveis' in path %}active{% endif %}">🏢 Imóveis</a>
        <a href="/match_ia" class="{% if '/match_ia' in path %}active{% endif %}">🤝 Match IA</a>
        <div class="menu-section-title">Marketing</div>
        <a href="/gerar_anuncio" class="{% if '/gerar_anuncio' in path %}active{% endif %}">🧠 Gerar Anúncio</a>
        <a href="/campanhas" class="{% if '/campanhas' in path %}active{% endif %}">📢 Campanhas</a>
    </div>
</div>

<div class="main">
    <div class="topbar">
        <h1>{% block pagina %}{% endblock %}</h1>
        <div class="user-controls">
            <a href="/leads_site" class="icone-topo">🎯 {% if total_leads_site > 0 %}<span class="badge">{{ total_leads_site }}</span>{% endif %}</a>
            <div class="dropdown">
                <button class="dropbtn">Olá, {{ session.get('nome', 'Usuário') }} ▾</button>
                <div class="dropdown-content">
                    <a href="/configuracoes">⚙ Configurações</a>
                    <a href="/logout" style="color: #ef4444;">🚪 Sair</a>
                </div>
            </div>
        </div>
    </div>

    {% block content %}{% endblock %}
</div>

<script>
function toggleChat() {
    const chat = document.getElementById('chat-widget');
    chat.style.display = (chat.style.display === 'flex') ? 'none' : 'flex';
}
</script>
</body>
</html>
