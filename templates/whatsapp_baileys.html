<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SMARTZEN WhatsApp</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body {
    font-family: Poppins, sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    margin: 0;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
}

.header {
    margin-bottom: 25px;
}

.card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.status {
    font-size: 18px;
    font-weight: 700;
}

.green { color: #00ff88; }
.red { color: #ff4d4d; }

button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 10px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.03);
}

.btn-connect {
    background: #00ff88;
    color: #0f172a;
}

.btn-disconnect {
    background: #ff4d4d;
    color: white;
}

.qr {
    text-align: center;
    margin-top: 20px;
}

.qr img {
    width: 260px;
    border-radius: 12px;
    background: white;
    padding: 10px;
}

small {
    opacity: 0.7;
}

.badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-left: 8px;
    background: rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>📱 SMARTZEN WhatsApp <span class="badge">Baileys Engine</span></h2>
        <small>Sessão: empresa_1</small>
    </div>

    <!-- STATUS -->
    <div class="card">

        <div>Status:</div>
        <div id="status" class="status red">🔴 Desconectado</div>

        <br>

        <button id="btnConnect" class="btn-connect" onclick="conectar()">Conectar</button>
        <button id="btnDisconnect" class="btn-disconnect" onclick="desconectar()" style="display:none;">Desconectar</button>

    </div>

    <!-- QR CODE -->
    <div class="card qr" id="qrBox">

        <div style="margin-bottom:10px;font-weight:600;">QR Code</div>

        <div id="qr"></div>

        <small id="info">Aguardando QR...</small>

    </div>

</div>

<script>

const sessao = "empresa_1";

async function atualizar() {

    const res = await fetch("http://localhost:3001/status/" + sessao);
    const data = await res.json();

    const status = document.getElementById("status");
    const qr = document.getElementById("qr");
    const info = document.getElementById("info");

    const btnConnect = document.getElementById("btnConnect");
    const btnDisconnect = document.getElementById("btnDisconnect");

    // 🔥 normaliza estado (IMPORTANTE)
    const conectado = data.conectado?.conectado ?? data.conectado ?? false;
    const pronto = data.conectado?.pronto ?? false;

    if (conectado) {

        status.innerHTML = "🟢 Conectado";
        status.className = "status green";

        qr.innerHTML = "";
        info.innerHTML = "Conectado ao WhatsApp";

        btnConnect.style.display = "none";
        btnDisconnect.style.display = "inline-block";

    } else {

        status.innerHTML = pronto ? "🟡 Conectando..." : "🔴 Desconectado";
        status.className = pronto ? "status green" : "status red";

        btnConnect.style.display = "inline-block";
        btnDisconnect.style.display = "none";

        if (data.qr) {

            qr.innerHTML = `<img src="${data.qr}" />`;
            info.innerHTML = "Escaneie o QR Code";

        } else {

            qr.innerHTML = "";
            info.innerHTML = "Gerando QR Code...";
        }
    }
}

async function conectar() {

    await fetch("http://localhost:3001/conectar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessao })
    });

}

async function desconectar() {

    await fetch("http://localhost:3001/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessao })
    });

}

setInterval(atualizar, 3000);
atualizar();

</script>

</body>
</html>
