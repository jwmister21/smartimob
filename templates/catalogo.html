<style>
:root {
    --cor: {{ config.cor_primaria }};
}

.header {
    background: var(--cor);
    padding: 20px;
    color: white;
}

.card {
    background: #111827;
    border-left: 4px solid var(--cor);
    padding: 15px;
    margin: 10px;
}
</style>

<div class="header">
    <h1>{{ config.nome_imobiliaria }}</h1>
</div>

<div class="grid">
    {% for imovel in imoveis %}
    <div class="card">
        <h3>{{ imovel.titulo }}</h3>
        <p>{{ imovel.cidade }} - {{ imovel.bairro }}</p>
        <p>💰 {{ imovel.valor }}</p>
    </div>
    {% endfor %}
</div>
