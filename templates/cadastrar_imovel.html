{% extends 'base.html' %}

{% block title %}Novo Imóvel{% endblock %}
{% block pagina %}Novo Imóvel{% endblock %}

{% block content %}
<style>
    /* Estilo White Clean */
    .card { background: #ffffff; padding: 30px; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .section-title { color: #111827; font-size: 18px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #f3f4f6; }
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .campo-box { display: flex; flex-direction: column; gap: 8px; }
    .campo-box label { color: #6b7280; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .form-grid input, .form-grid select, textarea { width: 100%; padding: 12px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 8px; color: #111827; transition: 0.2s; }
    .form-grid input:focus { border-color: #2563eb; outline: none; background: #fff; }

    /* Galeria */
    #preview-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding: 10px 0; margin-bottom: 20px; }
    .foto-thumbnail { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #e5e7eb; }
    
    .btn-salvar { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 15px 30px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-salvar:hover { background: #1d4ed8; }
    .btn-add-foto { background: #f3f4f6; color: #374151; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-block; }
</style>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <h3 class="section-title">Informações Gerais</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Título</label><input type="text" name="titulo" required></div>
            <div class="campo-box">
                <label>Tipo</label>
                <select name="tipo">
                    <option>Casa</option><option>Apartamento</option><option>Terreno</option>
                    <option>Duplex</option><option>Triplex</option><option>Kitnet</option>
                </select>
            </div>
            <div class="campo-box">
                <label>Comercialização</label>
                <select name="status"><option>Venda</option><option>Aluguel</option></select>
            </div>
        </div>

        <h3 class="section-title">Localização</h3>
        <div class="form-grid">
            <div class="campo-box"><label>CEP</label><input type="text" name="cep" id="cep" onblur="buscarCep()"></div>
            <div class="campo-box"><label>Rua</label><input type="text" name="rua" id="rua"></div>
            <div class="campo-box"><label>Bairro</label><input type="text" name="bairro" id="bairro"></div>
            <div class="campo-box"><label>Cidade</label><input type="text" name="cidade" id="cidade"></div>
        </div>

        <h3 class="section-title">Detalhes do Imóvel</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Área (m²)</label><input type="number" name="area"></div>
            <div class="campo-box"><label>Quartos</label><input type="number" name="quartos"></div>
            <div class="campo-box"><label>Banheiros</label><input type="number" name="banheiros"></div> <div class="campo-box"><label>Suítes</label><input type="number" name="suites"></div>
            <div class="campo-box"><label>Lavabo</label><input type="number" name="lavabo"></div>
            <div class="campo-box"><label>Vagas</label><input type="number" name="vaga_garagem"></div>
        </div>

        <h3 class="section-title">Valores</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Valor (R$)</label><input type="text" name="valor" id="valor"></div>
            <div class="campo-box"><label>IPTU</label><input type="text" name="iptu" id="iptu"></div>
            <div class="campo-box"><label>Condomínio</label><input type="text" name="condominio" id="condominio"></div>
        </div>

        <div class="campo-box" style="margin-bottom: 20px;">
            <label>Fotos do Imóvel</label>
            <label for="input-fotos" class="btn-add-foto">➕ Adicionar Fotos</label>
            <input type="file" name="fotos[]" id="input-fotos" accept="image/*" multiple style="display:none" onchange="previewFotos(event)">
            <div id="preview-container"></div>
        </div>

        <button type="submit" class="btn-salvar">💾 Salvar Imóvel</button>
    </form>
</div>

<script>
    let arquivosParaEnviar = new DataTransfer();

    function aplicarMascaraMoeda(idCampo) {
        const campo = document.getElementById(idCampo);
        if(!campo) return;
        campo.addEventListener('input', function(e){
            let valor = e.target.value.replace(/\D/g,'');
            if(valor === ''){ e.target.value = ''; return; }
            valor = (Number(valor) / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            e.target.value = valor;
        });
    }

    aplicarMascaraMoeda('valor');
    aplicarMascaraMoeda('iptu');
    aplicarMascaraMoeda('condominio');

    function previewFotos(event) {
        const input = event.target;
        const container = document.getElementById('preview-container');
        for (let i = 0; i < input.files.length; i++) {
            arquivosParaEnviar.items.add(input.files[i]);
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'foto-thumbnail';
                container.appendChild(img);
            };
            reader.readAsDataURL(input.files[i]);
        }
        input.files = arquivosParaEnviar.files;
    }

    async function buscarCep() {
        const cep = document.getElementById('cep').value.replace(/\D/g, '');
        if (cep.length !== 8) return;
        try {
            const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const data = await res.json();
            if (!data.erro) {
                document.getElementById('rua').value = data.logradouro;
                document.getElementById('bairro').value = data.bairro;
                document.getElementById('cidade').value = data.localidade;
            }
        } catch (e) { console.error(e); }
    }
</script>
{% endblock %}
