{% extends 'base.html' %}

{% block title %}Novo Imóvel{% endblock %}
{% block pagina %}Novo Imóvel{% endblock %}

{% block content %}
<style>
    /* Estilo White Clean */
    .card { background: #ffffff; padding: 30px; border-radius: 16px; border: 1px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .section-title { color: #111827; font-size: 18px; margin: 25px 0 15px 0; padding-bottom: 10px; border-bottom: 2px solid #f3f4f6; }
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .campo-box { display: flex; flex-direction: column; gap: 8px; }
    .campo-box label { color: #6b7280; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .form-grid input, .form-grid select, textarea { width: 100%; padding: 12px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 8px; color: #111827; transition: 0.2s; box-sizing: border-box; text-transform: uppercase; }
    .form-grid input:focus { border-color: #2563eb; outline: none; background: #fff; }
    
    /* Galeria */
    #preview-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding: 10px 0; margin-bottom: 20px; min-height: 130px; }
    .foto-thumbnail { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #e5e7eb; flex-shrink: 0; }
    
    .btn-salvar { background: #22c55e; color: #fff; border: none; border-radius: 8px; padding: 15px 30px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    .btn-add-foto { background: #f3f4f6; color: #374151; padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-block; width: fit-content; }
</style>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        
        <h3 class="section-title">Informações Gerais</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Título</label><input type="text" name="titulo" required></div>
            <div class="campo-box"><label>Propietário</label><input type="text" name="Propietário1" required></div>
            <div class="campo-box"><label>Telefone</label><input type="text" name="telefone2" required></div>
            <div class="campo-box">
                <label>Tipo</label>
                <select name="tipo">
                    <option>Casa</option><option>Apartamento</option><option>Terreno</option>
                    <option>Duplex</option><option>Triplex</option><option>Kitnet</option>
                    <option>Bangalo</option><option>Ponto Comercial</option>
                </select>
            </div>
            <div class="campo-box">
                <label>Comercialização</label>
                <select name="status"><option>Venda</option><option>Aluguel</option></select>
            </div>
        </div>

        <h3 class="section-title">Localização</h3>
        <div class="form-grid">
            <div class="campo-box"><label>CEP</label><input type="text" name="cep" id="cep" onblur="buscarCep()"></div>
            <div class="campo-box"><label>Rua / Logradouro</label><input type="text" name="rua" id="rua"></div>
            <div class="campo-box"><label>Bairro</label><input type="text" name="bairro" id="bairro"></div>
            <div class="campo-box"><label>Cidade</label><input type="text" name="cidade" id="cidade"></div>
        </div>

        <h3 class="section-title">Detalhes do Imóvel</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Área (m²)</label><input type="number" name="area"></div>
            <div class="campo-box"><label>Quartos</label><input type="number" name="quartos"></div>
            <div class="campo-box"><label>Suítes </label><input type="number" name="banheiros"></div>
            <div class="campo-box"><label>Banheiros </label><input type="number" name="banheiros21"></div>
            <div class="campo-box"><label>Lavabo</label><input type="number" name="lavabo" id="lavabo"></div>
            <div class="campo-box"><label>Vagas de Garagem</label><input type="number" name="vaga_garagem" id="vaga_garagem"></div>
            <div class="campo-box"><label>Sacadas</label><input type="number" name="sacada" id="sacada"></div>
            <div class="campo-box"><label>Lazer</label><input type="text" name="lazer" id="lazer"></div>
            <div class="campo-box">
                <label>Mobília</label>
                <select name="mobilia">
                    <option>Semi mobiliado</option>
                    <option>Porteira Fechada</option>
                    <option>Sem Mobilia</option>
                </select>
            </div>
        </div>

        <h3 class="section-title">Valores e Pagamento</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Valor (R$)</label><input type="text" name="valor" id="valor"></div>
            <div class="campo-box"><label>Valor IPTU (R$)</label><input type="text" name="iptu" id="iptu"></div>
            <div class="campo-box"><label>Valor Condomínio (R$)</label><input type="text" name="condominio" id="condominio"></div>
            <div class="campo-box"><label>Entrada</label><input type="text" name="entrada" id="entrada"></div>
            <div class="campo-box"><label>Parcela</label><input type="text" name="parcela" id="parcela"></div>
            <div class="campo-box"><label>Anuais</label><input type="text" name="anuais" id="anuais"></div>
            <div class="campo-box"><label>Prazo</label><input type="text" name="prazo" id="prazo"></div>
        </div>

        <div class="campo-box" style="margin-top:20px;">
            <label>Link (Drive/Fotos)</label>
            <input type="text" name="link" id="link">
        </div>

        <div class="campo-box" style="margin-top:20px;">
            <label>Descrição</label>
            <textarea name="descricao" rows="4"></textarea>
        </div>

        <div class="campo-box" style="margin-top:20px;">
            <label>Fotos do Imóvel</label>
            <label for="input-fotos" class="btn-add-foto">➕ Adicionar Fotos</label>
            <input type="file" name="fotos[]" id="input-fotos" accept="image/*" multiple style="display:none" onchange="previewFotos(event)">
            <div id="preview-container"></div>
        </div>

        <button type="submit" class="btn-salvar">💾 Salvar Imóvel</button>
    </form>
</div>

<script>
    let arquivosParaEnviar = new DataTransfer();

    function aplicarMascaraMoeda(idCampo){
        const campo = document.getElementById(idCampo);
        if(!campo) return;
        campo.addEventListener('input', function(e){
            let valor = e.target.value.replace(/\D/g,'');
            if(valor === ''){ e.target.value = ''; return; }
            valor = (Number(valor) / 100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
            e.target.value = valor;
        });
    }

    aplicarMascaraMoeda('valor');
    aplicarMascaraMoeda('iptu');
    aplicarMascaraMoeda('condominio');

    function previewFotos(event) {
        const input = event.target;
        const container = document.getElementById('preview-container');
        for (let i = 0; i < input.files.length; i++) {
            arquivosParaEnviar.items.add(input.files[i]);
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'foto-thumbnail';
                container.appendChild(img);
            };
            reader.readAsDataURL(input.files[i]);
        }
        input.files = arquivosParaEnviar.files;
    }

    async function buscarCep() {
        const cep = document.getElementById('cep').value.replace(/\D/g, '');
        if (cep.length !== 8) return;
        try {
            const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const dados = await resposta.json();
            if (!dados.erro) {
                document.getElementById('rua').value = dados.logradouro;
                document.getElementById('bairro').value = dados.bairro;
                document.getElementById('cidade').value = dados.localidade;
            } else { alert("CEP não encontrado."); }
        } catch (error) { console.error("Erro:", error); }
    }
</script>
{% endblock %}
