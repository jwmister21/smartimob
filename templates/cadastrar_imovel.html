{% extends 'base.html' %}

{% block title %}Novo Imóvel{% endblock %}
{% block pagina %}Novo Imóvel{% endblock %}

{% block content %}
<style>
    .card { background: #111827; padding: 25px; border-radius: 20px; border: 1px solid #1f2937; color: white; }
    .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .campo-box { display: flex; flex-direction: column; gap: 5px; }
    .campo-box label { color: #9ca3af; font-size: 13px; margin-left: 5px; }
    .form-grid input, .form-grid select, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #374151; border-radius: 10px; color: white; box-sizing: border-box; }

    /* Galeria Horizontal */
    #preview-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding: 10px 0; margin-top: 15px; min-height: 130px; }
    .foto-thumbnail { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 2px solid #374151; flex-shrink: 0; }
    
    .btn-salvar{
    background:#22c55e;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 15px;
    height:34px;
    width:auto;
    min-width:140px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
}
     input {
    text-transform: uppercase;
}
</style>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        
        <h3 class="section-title">Informações Gerais</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Título</label><input type="text" name="titulo" required></div>
            <div class="campo-box">
                <label>Tipo</label>
                <select name="tipo">
                    <option>Casa</option><option>Apartamento</option><option>Terreno</option>
                    <option>Duplex</option><option>Triplex</option><option>Kitnet</option>
                    <option>Bangalo</option><option>Ponto Comercial</option>
                </select>
            </div>
            <div class="campo-box">
                <label>Comercialização</label>
                <select name="status">
                    <option>Venda</option><option>Aluguel</option>
                </select>
            </div>
        </div>

        <h3 class="section-title">Localização</h3>
        <div class="form-grid">
            <div class="campo-box"><label>CEP</label><input type="text" name="cep" id="cep" placeholder="00000-000" onblur="buscarCep()"></div>
            <div class="campo-box"><label>Rua / Logradouro</label><input type="text" name="rua" id="rua"></div>
            <div class="campo-box"><label>Bairro</label><input type="text" name="bairro" id="bairro"></div>
            <div class="campo-box"><label>Cidade</label><input type="text" name="cidade" id="cidade"></div>
        </div>

        <h3 class="section-title">Detalhes do Imóvel</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Área (m²)</label><input type="number" name="area"></div>
            <div class="campo-box"><label>Quartos</label><input type="number" name="quartos"></div>
            <div class="campo-box"><label>Suítes</label><input type="number" name="banheiros"></div>
            <div class="campo-box"><label>Lavabo</label><input type="number" name="lavabo" id="lavabo"></div>
            <div class="campo-box"><label>Vagas de Garagem</label><input type="number" name="vaga_garagem" id="vaga_garagem"></div>
            <div class="campo-box"><label>Sacadas</label><input type="number" name="sacada" id="sacada"></div>
            <div class="campo-box"><label>Lazer</label><input type="text" name="lazer" id="lazer"></div>
        </div>

        <h3 class="section-title">Valores e Pagamento</h3>
        <div class="form-grid">
            <div class="campo-box"><label>Valor (R$)</label><input type="text" name="valor" id="valor" placeholder="R$ 0,00"></div>
            <div class="campo-box"><label>Valor IPTU (R$)</label><input type="text" name="iptu" id="iptu" placeholder="R$ 0,00"></div>
            <div class="campo-box"><label>Valor Condomínio (R$)</label><input type="text" name="condominio" id="condominio" placeholder="R$ 0,00"></div>
            <div class="campo-box"><label>Entrada</label><input type="text" name="entrada" id="entrada"></div>
            <div class="campo-box"><label>Parcela</label><input type="text" name="parcela" id="parcela" placeholder="Parcela"></div>
            <div class="campo-box"><label>Anuais</label><input type="text" name="anuais" id="anuais" placeholder="Anuais"></div>
            <div class="campo-box"><label>Prazo</label><input type="text" name="prazo" id="prazo" placeholder="Prazo"></div>
        </div>

        <div class="campo-box">
            <label>Link (Drive/Fotos)</label>
            <input type="text" name="link" id="link" placeholder="www.drive.com.br">
        </div>

        <div class="campo-box">
            <label>Descrição</label>
            <textarea name="descricao" rows="4" style="width: 100%;"></textarea>
        </div>
    </form>
</div>
 <div style="grid-column: 1 / -1; text-align:left; margin-top:15px;">
    
<div class="campo-box" style="margin-top:20px;">
    <label>Fotos do Imóvel</label>

    <label for="input-fotos" class="btn-acao btn-editar" style="width:fit-content;cursor:pointer;">
        ➕ Adicionar Fotos
    </label>
   
</div>
    <input 
        type="file" 
        name="fotos[]" 
        id="input-fotos" 
        accept="image/*" 
        multiple 
        style="display:none" 
        onchange="previewFotos(event)" >
    
    <div id="preview-container"></div>
</div>
  <button type="submit" class="btn-salvar">
        💾 Salvar Imóvel
    </button>          
<script>
    // 1. Variável global para manter o histórico de arquivos selecionados
    let arquivosParaEnviar = new DataTransfer();

    // Máscara de valor (mantive a sua)
    function aplicarMascaraMoeda(idCampo){

    const campo = document.getElementById(idCampo);

    if(!campo) return;

    campo.addEventListener('input', function(e){

        let valor = e.target.value.replace(/\D/g,'');

        if(valor === ''){
            e.target.value = '';
            return;
        }

        valor = (Number(valor) / 100).toLocaleString(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        );

        e.target.value = valor;
    });
}

aplicarMascaraMoeda('valor');
aplicarMascaraMoeda('iptu');
aplicarMascaraMoeda('condominio');

    // 2. Preview Horizontal Inteligente
    function previewFotos(event) {
        const input = event.target;
        const container = document.getElementById('preview-container');
        
        // Adiciona os novos arquivos selecionados à nossa lista global
        for (let i = 0; i < input.files.length; i++) {
            arquivosParaEnviar.items.add(input.files[i]);
            
            // Cria o elemento de visualização apenas para o arquivo novo
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'foto-thumbnail';
                container.appendChild(img);
            };
            reader.readAsDataURL(input.files[i]);
        }
        
        // 3. O SEGREDO: Atualiza o input com a lista acumulada de arquivos
        input.files = arquivosParaEnviar.files;
        
        console.log("Total de arquivos na fila:", input.files.length);
    }

    async function buscarCep() {
    const cep = document.getElementById('cep').value.replace(/\D/g, '');
    if (cep.length !== 8) return; // Valida se tem 8 números

    try {
        const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const dados = await resposta.json();

        if (!dados.erro) {
            document.getElementById('rua').value = dados.logradouro;
            document.getElementById('bairro').value = dados.bairro;
            document.getElementById('cidade').value = dados.localidade;
        } else {
            alert("CEP não encontrado.");
        }
    } catch (error) {
        console.error("Erro ao buscar CEP:", error);
    }
}
</script>
{% endblock %}
