{% extends 'base.html' %}

{% block title %}Novo Cliente{% endblock %}
{% block pagina %}Novo Cliente{% endblock %}

{% block content %}

<style>
    /* Estilo White Clean */
    .form-container {
        max-width: 900px;
        margin: 0 auto;
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .campo { display: flex; flex-direction: column; }
    .campo-full { grid-column: 1 / -1; }

    label { 
        margin-bottom: 8px; 
        color: #374151; 
        font-size: 13px; 
        font-weight: 600; 
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, select, textarea {
        width: 100%;
        padding: 14px;
        background: #f9fafb;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        color: #111827;
        font-size: 15px;
        box-sizing: border-box;
        transition: 0.2s;
    }

    input:focus, textarea:focus { 
        border-color: #2563eb; 
        outline: none; 
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .botoes { margin-top: 35px; display: flex; gap: 15px; }

    .btn-voltar { 
        background: #f3f4f6; color: #4b5563; text-decoration: none; 
        padding: 14px 28px; border-radius: 10px; font-weight: 600; 
    }
    .btn-voltar:hover { background: #e5e7eb; }
    
    .btn-salvar { 
        background: #2563eb; color: white; border: none; padding: 14px 28px; 
        border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .btn-salvar:hover { background: #1d4ed8; }

    @media(max-width:768px) { .form-grid { grid-template-columns: 1fr; } }
</style>

<div class="form-container">
    <form method="POST">
        <div class="form-grid">
            <div class="campo"><label>Nome</label><input type="text" name="nome" required></div>
            <div class="campo"><label>Telefone</label><input type="text" id="telefone" name="telefone" required></div>
            <div class="campo">
                <label>Origem Cliente</label>
                <select name="origem">
                    <option value="Tiktok">Tiktok</option>
                    <option value="Instagram">Instagram</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Site">Site</option>
                    <option value="anúncios">anúncios</option>
                    <option value="indicação">indicação</option>
                </select>
            </div>

            <div class="campo">
    <label>Criado por</label>
    <input type="text" value="{{ nome_criador }}" disabled>
</div>
            
            <div class="campo">
    <label for="entrada">Prédio </label>
    <input type="text" id="construtora" name="construtora">
</div>
            
            <div class="campo">
    <label for="entrada">Entrada / À vista</label>
    <input type="text" id="entrada" name="entrada" placeholder="R$ 0,00" oninput="formatarMoeda(this)">
</div>
            <div class="campo">
                <label>Forma Pagamento</label>
                <select name="pagamento">
                    <option value="financiamento">Financiamento</option>
                    <option value="Avista">À vista</option>   
                </select>
            </div>
            
            <div class="campo">
                <label>Interesse</label>
                <select name="interesse">
                    <option value="Casa">Casa</option>
                    <option value="Apartamento">Apartamento</option>
                    <option value="Terreno">Terreno</option>
                    <option value="Comercial">Comercial</option>
                </select>
            </div>
            <div class="campo"><label>Bairro Desejado</label><input type="text" name="bairro"></div>
            
            <div class="campo"><label>Faixa de Preço</label><input type="text" id="faixa_preco" name="faixa_preco" placeholder="R$ 0,00"></div>
            
            <div class="campo campo-full">
                <label>Sobre o Cliente</label>
                <textarea name="sobre" rows="4" placeholder="Adicione observações importantes sobre o cliente..."></textarea>
            </div>
        </div>

        <div class="botoes">
            <a href="/clientes" class="btn-voltar">← Voltar</a>
            <button class="btn-salvar" type="submit">💾 Salvar Cliente</button>
        </div>
    </form>
</div>

<script>
    function formatarMoeda(input) {
    let valor = input.value;
    
    // Remove tudo que não é número
    valor = valor.replace(/\D/g, "");
    
    // Transforma em centavos e formata
    valor = (valor / 100).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });
    
    input.value = valor;
}
    const telefone = document.getElementById("telefone");
    telefone.addEventListener("input", function(e){
        let v = e.target.value.replace(/\D/g,'');
        if(v.length > 11) v = v.slice(0,11);
        v = v.length > 10 ? v.replace(/^(\d{2})(\d{5})(\d{4}).*/, '($1) $2-$3') : v.replace(/^(\d{2})(\d{4})(\d{4}).*/, '($1) $2-$3');
        e.target.value = v;
    });

    const preco = document.getElementById("faixa_preco");
    preco.addEventListener("input", function(e){
        let valor = e.target.value.replace(/\D/g,'');
        if(valor === '') { e.target.value = ''; return; }
        valor = (Number(valor)/100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        e.target.value = valor;
    });
</script>

{% endblock %}
