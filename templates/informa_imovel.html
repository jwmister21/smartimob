<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ imovel.titulo }}</title>

    <style>
        /* Reset essencial para qualquer tela */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #f1f5f9; 
            color: #0f172a; 
            line-height: 1.5;
            overflow-x: hidden; /* Previne rolagem horizontal */
        }

        .container { 
            width: 95%; /* Adaptação inteligente */
            max-width: 1200px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 1fr 350px; 
            gap: 20px; 
            padding: 20px 0;
        }

        /* Garantia de imagens fluidas */
        img { max-width: 100%; height: auto; display: block; }

        /* Ajuste do grid para mobile */
        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Tipografia responsiva */
        h2 { font-size: clamp(1.2rem, 4vw, 1.8rem); }
        .valor { font-size: clamp(1.5rem, 5vw, 2.5rem); color: #16a34a; font-weight: 800; }

        /* Cards de características */
        .caracteristicas { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); 
            gap: 10px; 
            margin: 15px 0; 
        }
        .item { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; font-size: 0.9rem; }

        /* Formulário e Sidebar */
        .lead-box { background: white; padding: 20px; border-radius: 12px; position: sticky; top: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* Botões */
        .botoes { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 140px; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; color: white; font-weight: bold; }
    </style>
</head>
<body>

<main class="container">
    <section>
        <div class="galeria-principal">
            <img src="/uploads/imoveis/{{ imovel.fotos[0] }}" alt="Foto do Imóvel">
        </div>
        <div class="info">
            <h1>{{ imovel.titulo }}</h1>
            <p class="valor">{{ imovel.valor }}</p>
            <div class="caracteristicas">
                <div class="item">🛏 {{ imovel.quartos }} Quartos</div>
                <div class="item">📐 {{ imovel.area }} m²</div>
                <div class="item">🚗 {{ imovel.vaga_garagem }} Vagas</div>
            </div>
            <div class="descricao">
                <p>{{ imovel.descricao }}</p>
            </div>
        </div>
    </section>

    <aside>
        <div class="lead-box">
            <h2>Interessado?</h2>
            <form action="/capturar_lead" method="POST">
                <input type="text" name="nome" placeholder="Seu nome" style="width:100%; padding:10px; margin-bottom:10px;" required>
                <button type="submit" style="width:100%; padding:12px; background:#7c3aed; color:white; border:none; border-radius:8px;">Quero saber mais</button>
            </form>
        </div>
    </aside>
</main>

</body>
</html>
