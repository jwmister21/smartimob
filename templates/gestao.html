{% extends 'base.html' %}
{% block content %}

<style>
    .box { background: #ffffff; padding: 30px; border-radius: 20px; border: 1px solid #e2e8f0; }
    .tabela-admin { width: 100%; margin-top: 30px; border-collapse: separate; border-spacing: 0; }
    .tabela-admin th { background: #f8fafc; padding: 15px; color: #64748b; font-size: 0.75rem; text-transform: uppercase; text-align: left; border-bottom: 2px solid #e2e8f0; }
    .tabela-admin td { padding: 15px; border-bottom: 1px solid #f1f5f9; }
    
    .badge { padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 0.75rem; }
    .b-novo { background: #e0f2fe; color: #0369a1; }
    .b-negoc { background: #e0e7ff; color: #4338ca; }
    .b-visita { background: #fef3c7; color: #92400e; }
    .b-venda { background: #dcfce7; color: #166534; }
    .b-desist { background: #fee2e2; color: #991b1b; }
</style>

<div class="box">
    <h2>📊 Painel de Gestão</h2>
    
    <table class="tabela-admin">
        <thead>
            <tr>
                <th>Corretor</th>
                <th>Total</th>
                <th>Novo</th>
                <th>Negoc.</th>
                <th>Visita</th>
                <th>Venda</th>
                <th>Desist.</th>
            </tr>
        </thead>
        <tbody>
            {% for c in corretores %}
            <tr>
                <td style="font-weight: 600;">{{ c.nome }}</td>
                <td style="font-weight: 800;">{{ c.total }}</td>
                <td><span class="badge b-novo">{{ c.novo }}</span></td>
                <td><span class="badge b-negoc">{{ c.negoc }}</span></td>
                <td><span class="badge b-visita">{{ c.visita }}</span></td>
                <td><span class="badge b-venda">{{ c.venda }}</span></td>
                <td><span class="badge b-desist">{{ c.desist }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
